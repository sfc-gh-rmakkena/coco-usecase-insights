      SELECT
        PARTNER_NAME,
        COUNT_IF(IS_COCO_FINAL=TRUE)                                                  AS coco_uc,
        COUNT(USE_CASE_ID)                                                            AS total_uc,
        ROUND(COUNT_IF(IS_COCO_FINAL=TRUE)*100.0/NULLIF(COUNT(USE_CASE_ID),0),1)     AS coco_pct,
        ROUND(SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN USE_CASE_EACV ELSE 0 END)/1e6,1) AS coco_eacv_m
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL
      WHERE PARTNER_NAME IN (
        'Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp',
        'Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting',
        '7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc','kipi.ai','Kipi.ai',
        'evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
        'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
        'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC','Tiger Analytics Inc.',
        'Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle','Archetype Consulting',
        'Everforth Apex Systems','Tata Consultancy Services','OneSix','Icon Analytics',
        'Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies',
        'NTT DATA Group Corporation','MegazoneCloud Corporation','Infinite Lambda Limited',
        'Altis Consulting, ANZ','PROLIM Global Corporation',
        'INFOMOTION GMBH','CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)'
      )
      GROUP BY 1 ORDER BY coco_uc DESC NULLS LAST LIMIT 10

  # ── INDUSTRY (joins MDM.MDM_INTERFACES.DIM_USE_CASE for ACCOUNT_INDUSTRY) ──

  - name: q3_coco_by_industry
    question: CoCo adoption by industry in Q3
    sql: |
      SELECT
        d.ACCOUNT_INDUSTRY,
        COUNT(v.USE_CASE_ID)                                                              AS total_uc,
        COUNT_IF(v.IS_COCO_FINAL = TRUE)                                                  AS coco_uc,
        ROUND(COUNT_IF(v.IS_COCO_FINAL=TRUE)*100.0/NULLIF(COUNT(v.USE_CASE_ID),0),1)     AS coco_pct,
        ROUND(SUM(CASE WHEN v.IS_COCO_FINAL=TRUE THEN v.USE_CASE_EACV ELSE 0 END)/1e6,1) AS coco_eacv_m,
        ROUND(SUM(CASE WHEN v.IS_COCO_FINAL=TRUE THEN v.Q2_CREDITS ELSE 0 END),0)         AS coco_credits
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3 v
      JOIN MDM.MDM_INTERFACES.DIM_USE_CASE d ON v.USE_CASE_ID = d.USE_CASE_ID
      WHERE d.ACCOUNT_INDUSTRY IS NOT NULL
      GROUP BY 1 ORDER BY coco_uc DESC NULLS LAST

  - name: q3_top_industries_by_eacv
    question: Top industries by CoCo pipeline EACV in Q3
    sql: |
      SELECT
        d.ACCOUNT_INDUSTRY,
        COUNT_IF(v.IS_COCO_FINAL=TRUE)                                                    AS coco_uc,
