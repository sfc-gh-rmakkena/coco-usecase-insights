        CASE
          WHEN v.PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp','Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
          WHEN v.PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation','Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
          WHEN v.PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
          ELSE 'NOAM RSI'
        END                            AS partner_group,
        d.ACCOUNT_INDUSTRY,
        COUNT_IF(v.IS_COCO_FINAL=TRUE) AS coco_uc
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3 v
      JOIN MDM.MDM_INTERFACES.DIM_USE_CASE d ON v.USE_CASE_ID = d.USE_CASE_ID
      WHERE v.IS_COCO_FINAL = TRUE AND d.ACCOUNT_INDUSTRY IS NOT NULL
      GROUP BY 1,2 ORDER BY 1, coco_uc DESC NULLS LAST

  - name: q3_highest_coco_pct_industries
    question: Which industries have the highest CoCo adoption rate in Q3?
    sql: |
      SELECT
        d.ACCOUNT_INDUSTRY,
        COUNT_IF(v.IS_COCO_FINAL=TRUE)                                                AS coco_uc,
        COUNT(v.USE_CASE_ID)                                                          AS total_uc,
        ROUND(COUNT_IF(v.IS_COCO_FINAL=TRUE)*100.0/NULLIF(COUNT(v.USE_CASE_ID),0),1) AS coco_pct
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3 v
      JOIN MDM.MDM_INTERFACES.DIM_USE_CASE d ON v.USE_CASE_ID = d.USE_CASE_ID
      WHERE d.ACCOUNT_INDUSTRY IS NOT NULL
      GROUP BY 1
      HAVING COUNT(v.USE_CASE_ID) >= 5
      ORDER BY coco_pct DESC NULLS LAST

  - name: q3_industry_credits_ranking
    question: Which industries consume the most CoCo credits in Q3?
    sql: |
      SELECT
        d.ACCOUNT_INDUSTRY,
        ROUND(SUM(CASE WHEN v.IS_COCO_FINAL=TRUE THEN v.Q2_CREDITS ELSE 0 END),0)    AS coco_credits,
        COUNT_IF(v.IS_COCO_FINAL=TRUE)                                                AS coco_uc,
        ROUND(SUM(CASE WHEN v.IS_COCO_FINAL=TRUE THEN v.Q2_CREDITS ELSE 0 END)
              /NULLIF(COUNT_IF(v.IS_COCO_FINAL=TRUE),0),0)                            AS avg_credits_per_uc
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3 v
      JOIN MDM.MDM_INTERFACES.DIM_USE_CASE d ON v.USE_CASE_ID = d.USE_CASE_ID
      WHERE d.ACCOUNT_INDUSTRY IS NOT NULL AND v.IS_COCO_FINAL = TRUE
      GROUP BY 1 ORDER BY coco_credits DESC NULLS LAST

  - name: q3_enterprise_vs_majors_coco
    question: CoCo adoption by account segment (Enterprise vs Majors) in Q3
    sql: |
      SELECT
        d.ACCOUNT_SEGMENT,
        COUNT_IF(v.IS_COCO_FINAL=TRUE)                                                AS coco_uc,
        COUNT(v.USE_CASE_ID)                                                          AS total_uc,
        ROUND(COUNT_IF(v.IS_COCO_FINAL=TRUE)*100.0/NULLIF(COUNT(v.USE_CASE_ID),0),1) AS coco_pct,
        ROUND(SUM(CASE WHEN v.IS_COCO_FINAL=TRUE THEN v.USE_CASE_EACV ELSE 0 END)/1e6,1) AS coco_eacv_m
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3 v
      JOIN MDM.MDM_INTERFACES.DIM_USE_CASE d ON v.USE_CASE_ID = d.USE_CASE_ID
      WHERE d.ACCOUNT_SEGMENT IS NOT NULL
      GROUP BY 1 ORDER BY coco_uc DESC NULLS LAST
