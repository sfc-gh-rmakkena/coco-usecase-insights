  # ── DELIVERY SURFACE (CLI / Desktop / UI) ───────────────────────────────────
  # Every query here collapses to one row per account FIRST. Follow this pattern
  # for any surface question — a direct SUM over use case rows over-counts ~1.9x.

  - name: q3_surface_split
    question: CoCo adoption by CLI, Desktop and UI in Q3
    sql: |
      WITH acct AS (
        SELECT ACCOUNT_NAME_UPPER,
               MAX(CLI_CREDITS)      AS CLI_CREDITS,
               MAX(DESKTOP_CREDITS)  AS DESKTOP_CREDITS,
               MAX(UI_CREDITS)       AS UI_CREDITS,
               MAX(CLI_REQUESTS)     AS CLI_REQUESTS,
               MAX(DESKTOP_REQUESTS) AS DESKTOP_REQUESTS,
               MAX(UI_REQUESTS)      AS UI_REQUESTS
        FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
        WHERE IS_COCO_FINAL = TRUE
        GROUP BY 1
      ), tot AS (SELECT COUNT(*) AS coco_accounts FROM acct)
      SELECT 'CLI' AS surface,
             ROUND(SUM(a.CLI_CREDITS), 1) AS credits,
             SUM(a.CLI_REQUESTS)          AS requests,
             COUNT_IF(a.CLI_CREDITS > 0 OR a.CLI_REQUESTS > 0) AS accounts_active,
             ROUND(COUNT_IF(a.CLI_CREDITS > 0 OR a.CLI_REQUESTS > 0) * 100.0
                   / NULLIF(MAX(t.coco_accounts), 0), 1) AS surface_adoption_pct
      FROM acct a CROSS JOIN tot t
      UNION ALL
      SELECT 'Desktop', ROUND(SUM(a.DESKTOP_CREDITS), 1), SUM(a.DESKTOP_REQUESTS),
             COUNT_IF(a.DESKTOP_CREDITS > 0 OR a.DESKTOP_REQUESTS > 0),
             ROUND(COUNT_IF(a.DESKTOP_CREDITS > 0 OR a.DESKTOP_REQUESTS > 0) * 100.0
                   / NULLIF(MAX(t.coco_accounts), 0), 1)
      FROM acct a CROSS JOIN tot t
      UNION ALL
      SELECT 'UI', ROUND(SUM(a.UI_CREDITS), 1), SUM(a.UI_REQUESTS),
             COUNT_IF(a.UI_CREDITS > 0 OR a.UI_REQUESTS > 0),
             ROUND(COUNT_IF(a.UI_CREDITS > 0 OR a.UI_REQUESTS > 0) * 100.0
                   / NULLIF(MAX(t.coco_accounts), 0), 1)
      FROM acct a CROSS JOIN tot t
      ORDER BY credits DESC
    use_as_onboarding_question: true

  - name: q3_surface_split_by_partner
    question: Which surface does each partner use most in Q3?
    sql: |
      WITH acct AS (
        SELECT PARTNER_NAME, ACCOUNT_NAME_UPPER,
               MAX(CLI_CREDITS)     AS CLI_CREDITS,
               MAX(DESKTOP_CREDITS) AS DESKTOP_CREDITS,
               MAX(UI_CREDITS)      AS UI_CREDITS
        FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
        WHERE IS_COCO_FINAL = TRUE
        GROUP BY 1, 2
      )
      SELECT PARTNER_NAME,
             ROUND(SUM(CLI_CREDITS), 1)     AS cli_credits,
             ROUND(SUM(DESKTOP_CREDITS), 1) AS desktop_credits,
             ROUND(SUM(UI_CREDITS), 1)      AS ui_credits,
             COUNT(*)                       AS coco_accounts
      FROM acct
      GROUP BY 1
      ORDER BY (cli_credits + desktop_credits + ui_credits) DESC NULLS LAST

  - name: q3_cli_only_accounts
    question: How many CoCo accounts use the CLI but not the UI in Q3?
    sql: |
      WITH acct AS (
        SELECT ACCOUNT_NAME_UPPER,
               MAX(CLI_CREDITS) AS CLI_CREDITS,
               MAX(UI_CREDITS)  AS UI_CREDITS
        FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
        WHERE IS_COCO_FINAL = TRUE
        GROUP BY 1
      )
      SELECT COUNT_IF(CLI_CREDITS > 0 AND UI_CREDITS = 0)  AS cli_only,
             COUNT_IF(UI_CREDITS > 0 AND CLI_CREDITS = 0)  AS ui_only,
             COUNT_IF(CLI_CREDITS > 0 AND UI_CREDITS > 0)  AS both,
             COUNT(*)                                      AS coco_accounts
      FROM acct

  # ── ENGAGEMENT DEPTH (account-grain, dedup required) ────────────────────────
  # DISTINCT_USERS / ACTIVE_DAYS / TOTAL_REQUESTS / TOOLS_INVOKED / CUSTOM_SKILLS
  # and the S1-S4 / TOTAL_SCORE columns are ACCOUNT-level. Collapse to one row per
  # account BEFORE aggregating, exactly as these queries do.

  - name: q3_engagement_by_partner
    question: How many users and how much tool usage does each partner have in Q3?
    sql: |
      WITH acct AS (
        SELECT PARTNER_NAME, ACCOUNT_NAME_UPPER,
               MAX(DISTINCT_USERS) AS DISTINCT_USERS,
               MAX(ACTIVE_DAYS)    AS ACTIVE_DAYS,
               MAX(TOTAL_REQUESTS) AS TOTAL_REQUESTS,
               MAX(TOOLS_INVOKED)  AS TOOLS_INVOKED,
               MAX(CUSTOM_SKILLS)  AS CUSTOM_SKILLS
        FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
        WHERE IS_COCO_FINAL = TRUE
        GROUP BY 1, 2
      )
      SELECT PARTNER_NAME,
             COUNT(*)                  AS coco_accounts,
             SUM(DISTINCT_USERS)       AS total_users,
             ROUND(AVG(ACTIVE_DAYS),1) AS avg_active_days,
             SUM(TOTAL_REQUESTS)       AS total_requests,
             SUM(TOOLS_INVOKED)        AS tools_invoked,
             SUM(CUSTOM_SKILLS)        AS custom_skills
      FROM acct
      GROUP BY 1
      ORDER BY total_users DESC NULLS LAST
    use_as_onboarding_question: true

  - name: q3_engagement_top_accounts
    question: Which customer accounts have the most CoCo users in Q3?
    sql: |
      SELECT ACCOUNT_NAME_UPPER,
             MAX(PARTNER_NAME)   AS partner_name,
             MAX(DISTINCT_USERS) AS distinct_users,
             MAX(ACTIVE_DAYS)    AS active_days,
             MAX(TOTAL_REQUESTS) AS total_requests,
             MAX(CUSTOM_SKILLS)  AS custom_skills,
             MAX(LAST_ACTIVE)    AS last_active
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
      WHERE IS_COCO_FINAL = TRUE
      GROUP BY 1
      ORDER BY distinct_users DESC NULLS LAST
      LIMIT 20

  - name: q3_confidence_score_components
    question: Why did these use cases get a High confidence score in Q3?
    sql: |
      SELECT USE_CASE_ID,
             USE_CASE_NAME,
             ACCOUNT_NAME,
             PARTNER_NAME,
             WORKLOAD_CATEGORY,
             CONFIDENCE_BAND,
             TOTAL_SCORE,
             S1_SCORE AS s1_skill_relevance,
             S2_SCORE AS s2_custom_skills,
             S3_SCORE AS s3_tool_usage,
             S4_SCORE AS s4_usage_intensity
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
      ORDER BY TOTAL_SCORE DESC NULLS LAST
      LIMIT 20

  - name: q3_deployed_by_month
    question: How many use cases went live each month in Q3?
    sql: |
      SELECT DATE_TRUNC('month', GO_LIVE_DATE) AS go_live_month,
             COUNT(*)                          AS total_uc,
             COUNT_IF(IS_COCO_FINAL = TRUE)    AS coco_uc,
             ROUND(COUNT_IF(IS_COCO_FINAL = TRUE) * 100.0
                   / NULLIF(COUNT(*), 0), 1)   AS coco_pct
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
      WHERE USE_CASE_STAGE IN ('5 - Implementation In Progress',
                               '6 - Implementation Complete', '7 - Deployed')
        AND GO_LIVE_DATE IS NOT NULL
      GROUP BY 1
      ORDER BY 1

  # ── CREDIT / TOKEN CONSUMPTION ──────────────────────────────────────────────

  - name: q3_coco_credits_by_group
    question: CoCo credit consumption by partner group in Q3
    sql: |
      SELECT
        CASE
          WHEN PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp','Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
          WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation','Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
          WHEN PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
          ELSE 'NOAM RSI'
        END                                                                   AS partner_group,
        ROUND(SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN Q2_CREDITS ELSE 0 END),0) AS coco_credits,
        ROUND(SUM(Q2_CREDITS),0)                                               AS total_credits,
        COUNT_IF(IS_COCO_FINAL=TRUE)                                           AS coco_uc
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
      GROUP BY 1 ORDER BY coco_credits DESC NULLS LAST

  - name: q3_wow_credits_by_partner
    question: Week-over-week credit change by partner in Q3
    sql: |
      SELECT
        PARTNER_NAME,
        ROUND(SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN LAST7_CREDITS ELSE 0 END),2)  AS last7_credits,
        ROUND(SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN PRIOR7_CREDITS ELSE 0 END),2) AS prior7_credits,
        ROUND((SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN LAST7_CREDITS ELSE 0 END)
              -SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN PRIOR7_CREDITS ELSE 0 END))*100.0
              /NULLIF(SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN PRIOR7_CREDITS ELSE 0 END),0),1) AS wow_pct
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
      WHERE LAST7_CREDITS > 0 OR PRIOR7_CREDITS > 0
      GROUP BY 1 ORDER BY last7_credits DESC NULLS LAST

  - name: q3_top10_accounts_by_credits
    question: Top 10 customer accounts by CoCo credit consumption in Q3
    sql: |
      SELECT
        ACCOUNT_NAME,
        PARTNER_NAME,
        ROUND(Q2_CREDITS,2)    AS q3_credits,
        Q2_TOKENS              AS q3_tokens,
        ROUND(LAST7_CREDITS,2) AS last7_credits,
        ROUND(PRIOR7_CREDITS,2) AS prior7_credits
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
      WHERE IS_COCO_FINAL = TRUE AND Q2_CREDITS > 0
      ORDER BY Q2_CREDITS DESC NULLS LAST LIMIT 10

  - name: q3_wow_tokens_by_partner
    question: Week-over-week token change by partner in Q3
    sql: |
      SELECT
        PARTNER_NAME,
        SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN LAST7_TOKENS ELSE 0 END)   AS last7_tokens,
        SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN PRIOR7_TOKENS ELSE 0 END)  AS prior7_tokens,
        ROUND((SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN LAST7_TOKENS ELSE 0 END)
              -SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN PRIOR7_TOKENS ELSE 0 END))*100.0
              /NULLIF(SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN PRIOR7_TOKENS ELSE 0 END),0),1) AS wow_pct
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
      WHERE LAST7_TOKENS > 0 OR PRIOR7_TOKENS > 0
      GROUP BY 1 ORDER BY last7_tokens DESC NULLS LAST

  # ── QoQ COMPARISON ──────────────────────────────────────────────────────────

  - name: q2_vs_q3_by_group
    question: Compare CoCo adoption between Q2 and Q3 by partner group
    sql: |
      SELECT
        g.partner_group,
        q2.coco_uc AS q2_coco_uc, q2.total_uc AS q2_total_uc, q2.coco_pct AS q2_coco_pct,
        q3.coco_uc AS q3_coco_uc, q3.total_uc AS q3_total_uc, q3.coco_pct AS q3_coco_pct,
        q3.coco_uc - q2.coco_uc AS coco_uc_delta,
        ROUND(q3.coco_pct - q2.coco_pct, 1) AS pct_delta
      FROM (
        SELECT CASE
          WHEN PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp','Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
          WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation','Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
          WHEN PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
          ELSE 'NOAM RSI' END AS partner_group
        FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3
        GROUP BY 1
      ) g
      LEFT JOIN (
        SELECT CASE
          WHEN PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp','Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
          WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation','Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
          WHEN PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
          ELSE 'NOAM RSI' END AS partner_group,
          COUNT_IF(IS_COCO_FINAL=TRUE) AS coco_uc, COUNT(USE_CASE_ID) AS total_uc,
          ROUND(COUNT_IF(IS_COCO_FINAL=TRUE)*100.0/NULLIF(COUNT(USE_CASE_ID),0),1) AS coco_pct
        FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q2 GROUP BY 1
      ) q2 ON g.partner_group = q2.partner_group
      LEFT JOIN (
        SELECT CASE
          WHEN PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp','Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
          WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation','Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
          WHEN PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
          ELSE 'NOAM RSI' END AS partner_group,
          COUNT_IF(IS_COCO_FINAL=TRUE) AS coco_uc, COUNT(USE_CASE_ID) AS total_uc,
          ROUND(COUNT_IF(IS_COCO_FINAL=TRUE)*100.0/NULLIF(COUNT(USE_CASE_ID),0),1) AS coco_pct
        FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3 GROUP BY 1
      ) q3 ON g.partner_group = q3.partner_group
      ORDER BY g.partner_group

  - name: q2_vs_q3_per_partner
    question: Compare each partner's CoCo count between Q2 and Q3
    sql: |
      SELECT
        COALESCE(q3.PARTNER_NAME, q2.PARTNER_NAME)   AS partner_name,
        COALESCE(q2.coco_uc, 0)                       AS q2_coco_uc,
        COALESCE(q3.coco_uc, 0)                       AS q3_coco_uc,
        COALESCE(q3.coco_uc,0) - COALESCE(q2.coco_uc,0) AS delta
      FROM (
        SELECT PARTNER_NAME, COUNT_IF(IS_COCO_FINAL=TRUE) AS coco_uc
        FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q2 GROUP BY 1
      ) q2
      FULL OUTER JOIN (
        SELECT PARTNER_NAME, COUNT_IF(IS_COCO_FINAL=TRUE) AS coco_uc
        FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3 GROUP BY 1
      ) q3 ON q2.PARTNER_NAME = q3.PARTNER_NAME
      ORDER BY delta DESC NULLS LAST

