name: coco_adoption_model
description: >
  CoCo (Cortex Code) partner adoption semantic model. ~44 managed OKR partners across
  GSI (global), NOAM RSI (NoAM), APJ RSI (country), EMEA RSI (region) groups.

  ALWAYS filter IS_COCO_FINAL = TRUE for CoCo use case counts unless the user asks for
  "total", "all", or "non-CoCo".

  IS_COCO_FINAL = IS_COCO=TRUE (keyword/flag) OR CONFIDENCE_BAND='High' (usage score>=75).

  TABLE SELECTION — CRITICAL. Pick the table that matches the query period:
    Q1 (Feb-Apr 2026):     use table "use_cases_q1"  — scored from Feb 1 2026
    Q2 (May-Jul 2026):     use table "use_cases_q2"  — scored from May 1 2026
    Q3 (Aug-Oct 2026):     use table "use_cases_q3"  — scored from Aug 1 2026  ← current quarter
    YTD / full FY27:       use table "use_cases_ytd" — scored from Feb 1 2026, all quarters

  Each quarter table is pre-scoped: it ONLY contains use cases in that quarter.
  No date filter needed when querying a quarter table.
  YTD table contains all FY27 use cases — no date filter needed for YTD.

  FY27 quarters:
    Q1: 2026-02-01 to 2026-04-30
    Q2: 2026-05-01 to 2026-07-31  (last quarter)
    Q3: 2026-08-01 to 2026-10-31  (current quarter, default)

  Partner groups:
    GSI:      Global. Accenture, Capgemini Technologies LLC, Cognizant Technology Solutions US Corp,
              Deloitte Consulting, EY/Ernst & Young (EY), IBM/IBM Consulting. Target 75%.
    NOAM RSI: NoAM theaters (USMajors, AMSExpansion, AMSAcquisition, USPubSec). ~30 partners. Target 75%.
    APJ RSI:  Country-scoped. NTT DATA (Japan), MegazoneCloud (Korea), Infinite Lambda (ASEAN),
              Altis (ANZ), Prolim (India). Target 50%.
    EMEA RSI: Region-scoped. Infomotion (CentralEMEA), Civica (SouthEMEA),
              Kubrick (UK), KPC (SouthEMEA). Target 50%.

  Theaters: USMajors=S Majors=Majors. AMSExpansion, AMSAcquisition, USPubSec=NoAM. EMEA, APJ.
  Token WoW: Last7d=DS>=DATEADD(day,-7,TODAY()). Prior7d between -14d and -7d. WoW%=(L7-P7)/P7*100.

# Shared filters/dimensions/measures applied to all quarter tables
# (defined once under use_cases_q3, referenced by description in others)

tables:
  - name: use_cases_q3
    description: >
      Q3 FY27 (Aug-Oct 2026, CURRENT QUARTER). Use cases scored from Aug 1 2026.
      Pre-scoped to Q3 — no date filter needed. Matches dashboard Q3 numbers exactly.
      ALWAYS filter IS_COCO_FINAL = TRUE for CoCo counts.
    base_table:
      database: TEMP
      schema: COCO_PARTNER_ADOPTION
      table: V_OKR_USE_CASES_COCO_FINAL_Q3
    filters:
      - name: managed_partners
        synonyms: [managed, OKR partners, tracked, 44 partners, all managed]
        description: All ~44 OKR-tracked managed partners
        expr: >
          PARTNER_NAME IN (
            'Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp',
            'Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting',
            '7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc','kipi.ai','Kipi.ai',
            'evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
            'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
            'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC',
            'Tiger Analytics Inc.','Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle',
            'Archetype Consulting','Everforth Apex Systems','Tata Consultancy Services',
            'OneSix','Icon Analytics','Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies',
            'NTT DATA Group Corporation','MegazoneCloud Corporation',
            'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
            'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation',
            'INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.',
            'Kubrick Group','KPC (Key Performance Consulting)','KPC'
          )
      - name: is_coco_final
        synonyms: [coco attributed, IS_COCO_FINAL, coco qualified, coco final, coco use cases]
        description: IS_COCO_FINAL = TRUE. THE DEFAULT COCO FILTER. Always apply for CoCo counts.
        expr: IS_COCO_FINAL = TRUE
      - name: deployed
        synonyms: [stage 7, deployed, go-live, production, live]
        description: Stage 7 Deployed
        expr: USE_CASE_STAGE = '7 - Deployed'
      - name: gsi_group
        synonyms: [gsi, global system integrators, GSI partners]
        description: GSI partners — global scope, target 75%
        expr: >
          PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC',
            'Cognizant Technology Solutions US Corp','Deloitte Consulting',
            'EY','Ernst & Young (EY)','IBM','IBM Consulting')
      - name: noam_rsi_group
        synonyms: [NOAM RSI, north america RSI, NOAM partners]
        description: NOAM RSI partners — NoAM theaters, target 75%
        expr: >
          PARTNER_NAME IN ('7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc',
            'kipi.ai','Kipi.ai','evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
            'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
            'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC',
            'Tiger Analytics Inc.','Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle',
            'Archetype Consulting','Everforth Apex Systems','Tata Consultancy Services',
            'OneSix','Icon Analytics','Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies')
      - name: usmajors_theater
        synonyms: [USMajors, US Majors, S Majors, Majors]
        description: USMajors theater
        expr: THEATER_NAME = 'USMajors'
    dimensions:
      - name: partner_name
        synonyms: [partner, SI, company]
        description: Partner name. IBM Consulting=IBM, Ernst & Young (EY)=EY, LTI Mindtree=LTM, Kipi.ai=kipi.ai.
        expr: PARTNER_NAME
        data_type: TEXT
      - name: account_name
        synonyms: [customer, account]
        description: Customer account name
        expr: ACCOUNT_NAME
        data_type: TEXT
      - name: use_case_id
        synonyms: [uc id, id]
        description: Unique use case identifier
        expr: USE_CASE_ID
        data_type: TEXT
      - name: use_case_stage
        synonyms: [stage, status, lifecycle stage]
        description: "'3 - Technical / Business Validation' | '4 - Use Case Won / Migration Plan' | '5 - Implementation In Progress' | '6 - Implementation Complete' | '7 - Deployed'. Never use numeric stage values."
        expr: USE_CASE_STAGE
        data_type: TEXT
      - name: theater
        synonyms: [theater name, geo, sales theater]
        description: USMajors=S Majors. AMSExpansion, AMSAcquisition, USPubSec=NoAM. EMEA, APJ.
        expr: THEATER_NAME
        data_type: TEXT
      - name: region
        synonyms: [region name, sub-region, country, industry, vertical, sub category, subcategory, additional breakdown, theatre breakdown, theater breakdown, breakdown within theatre, next level breakdown]
        description: "Next level of the sales hierarchy BELOW theater - the theater breakdown / sub-category. Its meaning depends on the theater: USMajors=INDUSTRY (HCLS, FSI, FSIGlobal, TMT, MFG, RCG); USPubSec=government tier (Federal, SLED); APJ=country (ANZ, India, ASEAN, Japan, Korea, China); EMEA=sub-geography (CentralEMEA, SouthEMEA, NorthEMEA, UK, META, EMEACommercial); AMSExpansion=US/Canada geography (CentralExp, NortheastExp, SoutheastExp, SouthwestExp, NorthwestExp, USGrowthExp, CanadaExp, Commercial); AMSAcquisition=segment x geography (EntAcq/CommAcq East|West|Central, MajorsAcq, LATAM). ALWAYS use this to break a single theater down further - e.g. 'US Majors breakdown' means GROUP BY region WHERE theater='USMajors'. Do NOT group by theater to break down one theater."
        expr: REGION_NAME
        data_type: TEXT
      - name: is_coco_final
        synonyms: [IS_COCO_FINAL, coco final, coco qualified, coco attributed]
        description: TRUE = IS_COCO_FINAL. THE PRIMARY COCO FLAG. Always filter this = TRUE for CoCo counts.
        expr: IS_COCO_FINAL
        data_type: BOOLEAN
      - name: is_coco_keyword
        synonyms: [IS_COCO, keyword coco, se tagged]
        description: Keyword/flag only — SE comments, partner #coco, feature flag
        expr: IS_COCO
        data_type: BOOLEAN
      - name: confidence_band
        synonyms: [confidence, score band]
        description: "High(>=75)=IS_COCO_FINAL. Medium(40-74). Low(1-39). No Signal(0)."
        expr: CONFIDENCE_BAND
        data_type: TEXT
      - name: coco_source
        synonyms: [attribution source, detection method]
        description: SE_COMMENTS | PARTNER_COMMENTS | FEATURE_FLAG | MULTIPLE
        expr: COCO_SOURCE
        data_type: TEXT
      - name: workload_category
        synonyms: [workload, domain, category]
        description: "AI | Analytics | Data Engineering | Platform | Apps & Collab | Migration"
        expr: WORKLOAD_CATEGORY
        data_type: TEXT
      - name: technical_use_case
        synonyms: [tech uc, use case type]
        description: "Prefixed category: AI:, Analytics:, DE:, Platform:, Apps & Collab:"
        expr: TECHNICAL_USE_CASE
        data_type: TEXT
      - name: eacv
        synonyms: [acv, opportunity value, deal value]
        description: Estimated Annual Contract Value in USD
        expr: USE_CASE_EACV
        data_type: NUMBER
      - name: partner_group
        synonyms: [group, partner type, segment]
        description: GSI | NOAM RSI | APJ RSI | EMEA RSI
        expr: >
          CASE
            WHEN PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC',
              'Cognizant Technology Solutions US Corp','Deloitte Consulting',
              'EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
            WHEN PARTNER_NAME IN ('7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc',
              'kipi.ai','Kipi.ai','evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
              'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
              'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC','Tiger Analytics Inc.',
              'Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle','Archetype Consulting',
              'Everforth Apex Systems','Tata Consultancy Services','OneSix','Icon Analytics',
              'Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies') THEN 'NOAM RSI'
            WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation',
              'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
              'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
            WHEN PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint',
              'CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
            ELSE 'Other'
          END
        data_type: TEXT
    measures:
      - name: total_use_cases
        synonyms: [number of use cases, uc count, total UCs, all use cases]
        description: Total use cases regardless of CoCo status
        expr: COUNT(USE_CASE_ID)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_use_cases
        synonyms: [coco use cases, IS_COCO_FINAL count, coco count, coco UCs, coco qualified, attributed UCs]
        description: IS_COCO_FINAL = TRUE count. THE DEFAULT COCO METRIC.
        expr: COUNT_IF(IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_pct
        synonyms: [coco rate, coco attachment rate, coco %, adoption rate]
        description: IS_COCO_FINAL % of total. Target 75% GSI/NOAM RSI, 50% APJ/EMEA RSI.
        expr: ROUND(COUNT_IF(IS_COCO_FINAL = TRUE) * 100.0 / NULLIF(COUNT(USE_CASE_ID), 0), 1)
        data_type: NUMBER
        default_aggregation: sum
      - name: deployed_use_cases
        synonyms: [stage 7 count, deployed, go-lives]
        description: Stage 7 Deployed count
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed')
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_deployed
        synonyms: [coco go-lives, coco deployed, deployed with coco]
        description: Deployed IS_COCO_FINAL use cases
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed' AND IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: total_eacv
        synonyms: [total ACV, pipeline value, total revenue]
        description: Total eACV in USD
        expr: SUM(USE_CASE_EACV)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_eacv
        synonyms: [coco ACV, coco revenue, coco pipeline value]
        description: eACV of IS_COCO_FINAL use cases
        expr: SUM(CASE WHEN IS_COCO_FINAL = TRUE THEN USE_CASE_EACV ELSE 0 END)
        data_type: NUMBER
        default_aggregation: sum
      - name: distinct_partners
        synonyms: [partner count, number of partners, unique partners]
        description: Count of distinct partner companies
        expr: COUNT(DISTINCT PARTNER_NAME)
        data_type: NUMBER
        default_aggregation: sum

