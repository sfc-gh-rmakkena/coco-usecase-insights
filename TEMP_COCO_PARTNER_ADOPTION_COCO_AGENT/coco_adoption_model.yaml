name: coco_adoption_model
description: >
  CoCo (Cortex Code) partner adoption semantic model. ~44 managed OKR partners across
  GSI (global), NOAM RSI (NoAM), APJ RSI (country), EMEA RSI (region) groups.

  ALWAYS filter IS_COCO_FINAL = TRUE for CoCo use case counts unless the user asks for
  "total", "all", or "non-CoCo".

  IS_COCO_FINAL = IS_COCO=TRUE (keyword/flag) OR CONFIDENCE_BAND='High' (usage score>=75).

  TABLE SELECTION — CRITICAL. Pick the table that matches the query period:
    Q1 (Feb-Apr 2026):     use table "use_cases_q1"  — scored from Feb 1 2026
    Q2 (May-Jul 2026):     use table "use_cases_q2"  — scored from May 1 2026
    Q3 (Aug-Oct 2026):     use table "use_cases_q3"  — scored from Aug 1 2026  ← current quarter
    YTD / full FY27:       use table "use_cases_ytd" — scored from Feb 1 2026, all quarters

  Each quarter table is pre-scoped: it ONLY contains use cases in that quarter.
  No date filter needed when querying a quarter table.
  YTD table contains all FY27 use cases — no date filter needed for YTD.

  FY27 quarters:
    Q1: 2026-02-01 to 2026-04-30
    Q2: 2026-05-01 to 2026-07-31  (last quarter)
    Q3: 2026-08-01 to 2026-10-31  (current quarter, default)

  Partner groups:
    GSI:      Global. Accenture, Capgemini Technologies LLC, Cognizant Technology Solutions US Corp,
              Deloitte Consulting, EY/Ernst & Young (EY), IBM/IBM Consulting. Target 75%.
    NOAM RSI: NoAM theaters (USMajors, AMSExpansion, AMSAcquisition, USPubSec). ~30 partners. Target 75%.
    APJ RSI:  Country-scoped. NTT DATA (Japan), MegazoneCloud (Korea), Infinite Lambda (ASEAN),
              Altis (ANZ), Prolim (India). Target 50%.
    EMEA RSI: Region-scoped. Infomotion (CentralEMEA), Civica (SouthEMEA),
              Kubrick (UK), KPC (SouthEMEA). Target 50%.

  Theaters: USMajors=S Majors=Majors. AMSExpansion, AMSAcquisition, USPubSec=NoAM. EMEA, APJ.
  Token WoW: Last7d=DS>=DATEADD(day,-7,TODAY()). Prior7d between -14d and -7d. WoW%=(L7-P7)/P7*100.

# Shared filters/dimensions/measures applied to all quarter tables
# (defined once under use_cases_q3, referenced by description in others)

tables:
  - name: use_cases_q3
    description: >
      Q3 FY27 (Aug-Oct 2026, CURRENT QUARTER). Use cases scored from Aug 1 2026.
      Pre-scoped to Q3 — no date filter needed. Matches dashboard Q3 numbers exactly.
      ALWAYS filter IS_COCO_FINAL = TRUE for CoCo counts.
    base_table:
      database: TEMP
      schema: COCO_PARTNER_ADOPTION
      table: V_OKR_USE_CASES_COCO_FINAL_Q3
    filters:
      - name: managed_partners
        synonyms: [managed, OKR partners, tracked, 44 partners, all managed]
        description: All ~44 OKR-tracked managed partners
        expr: >
          PARTNER_NAME IN (
            'Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp',
            'Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting',
            '7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc','kipi.ai','Kipi.ai',
            'evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
            'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
            'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC',
            'Tiger Analytics Inc.','Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle',
            'Archetype Consulting','Everforth Apex Systems','Tata Consultancy Services',
            'OneSix','Icon Analytics','Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies',
            'NTT DATA Group Corporation','MegazoneCloud Corporation',
            'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
            'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation',
            'INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.',
            'Kubrick Group','KPC (Key Performance Consulting)','KPC'
          )
      - name: is_coco_final
        synonyms: [coco attributed, IS_COCO_FINAL, coco qualified, coco final, coco use cases]
        description: IS_COCO_FINAL = TRUE. THE DEFAULT COCO FILTER. Always apply for CoCo counts.
        expr: IS_COCO_FINAL = TRUE
      - name: deployed
        synonyms: [stage 7, deployed, go-live, production, live]
        description: Stage 7 Deployed
        expr: USE_CASE_STAGE = '7 - Deployed'
      - name: gsi_group
        synonyms: [gsi, global system integrators, GSI partners]
        description: GSI partners — global scope, target 75%
        expr: >
          PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC',
            'Cognizant Technology Solutions US Corp','Deloitte Consulting',
            'EY','Ernst & Young (EY)','IBM','IBM Consulting')
      - name: noam_rsi_group
        synonyms: [NOAM RSI, north america RSI, NOAM partners]
        description: NOAM RSI partners — NoAM theaters, target 75%
        expr: >
          PARTNER_NAME IN ('7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc',
            'kipi.ai','Kipi.ai','evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
            'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
            'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC',
            'Tiger Analytics Inc.','Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle',
            'Archetype Consulting','Everforth Apex Systems','Tata Consultancy Services',
            'OneSix','Icon Analytics','Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies')
      - name: usmajors_theater
        synonyms: [USMajors, US Majors, S Majors, Majors]
        description: USMajors theater
        expr: THEATER_NAME = 'USMajors'
    dimensions:
      - name: partner_name
        synonyms: [partner, SI, company]
        description: Partner name. IBM Consulting=IBM, Ernst & Young (EY)=EY, LTI Mindtree=LTM, Kipi.ai=kipi.ai.
        expr: PARTNER_NAME
        data_type: TEXT
      - name: account_name
        synonyms: [customer, account]
        description: Customer account name
        expr: ACCOUNT_NAME
        data_type: TEXT
      - name: use_case_id
        synonyms: [uc id, id]
        description: Unique use case identifier
        expr: USE_CASE_ID
        data_type: TEXT
      - name: use_case_stage
        synonyms: [stage, status, lifecycle stage]
        description: "'3 - Technical / Business Validation' | '4 - Use Case Won / Migration Plan' | '5 - Implementation In Progress' | '6 - Implementation Complete' | '7 - Deployed'. Never use numeric stage values."
        expr: USE_CASE_STAGE
        data_type: TEXT
      - name: theater
        synonyms: [theater name, geo, sales theater]
        description: USMajors=S Majors. AMSExpansion, AMSAcquisition, USPubSec=NoAM. EMEA, APJ.
        expr: THEATER_NAME
        data_type: TEXT
      - name: region
        synonyms: [region name, sub-region, country, industry, vertical, sub category, subcategory, additional breakdown, theatre breakdown, theater breakdown, breakdown within theatre, next level breakdown]
        description: "Next level of the sales hierarchy BELOW theater - the theater breakdown / sub-category. Its meaning depends on the theater: USMajors=INDUSTRY (HCLS, FSI, FSIGlobal, TMT, MFG, RCG); USPubSec=government tier (Federal, SLED); APJ=country (ANZ, India, ASEAN, Japan, Korea, China); EMEA=sub-geography (CentralEMEA, SouthEMEA, NorthEMEA, UK, META, EMEACommercial); AMSExpansion=US/Canada geography (CentralExp, NortheastExp, SoutheastExp, SouthwestExp, NorthwestExp, USGrowthExp, CanadaExp, Commercial); AMSAcquisition=segment x geography (EntAcq/CommAcq East|West|Central, MajorsAcq, LATAM). ALWAYS use this to break a single theater down further - e.g. 'US Majors breakdown' means GROUP BY region WHERE theater='USMajors'. Do NOT group by theater to break down one theater."
        expr: REGION_NAME
        data_type: TEXT
      - name: is_coco_final
        synonyms: [IS_COCO_FINAL, coco final, coco qualified, coco attributed]
        description: TRUE = IS_COCO_FINAL. THE PRIMARY COCO FLAG. Always filter this = TRUE for CoCo counts.
        expr: IS_COCO_FINAL
        data_type: BOOLEAN
      - name: is_coco_keyword
        synonyms: [IS_COCO, keyword coco, se tagged]
        description: Keyword/flag only — SE comments, partner #coco, feature flag
        expr: IS_COCO
        data_type: BOOLEAN
      - name: confidence_band
        synonyms: [confidence, score band]
        description: "High(>=75)=IS_COCO_FINAL. Medium(40-74). Low(1-39). No Signal(0)."
        expr: CONFIDENCE_BAND
        data_type: TEXT
      - name: coco_source
        synonyms: [attribution source, detection method]
        description: SE_COMMENTS | PARTNER_COMMENTS | FEATURE_FLAG | MULTIPLE
        expr: COCO_SOURCE
        data_type: TEXT
      - name: workload_category
        synonyms: [workload, domain, category]
        description: "AI | Analytics | Data Engineering | Platform | Apps & Collab | Migration"
        expr: WORKLOAD_CATEGORY
        data_type: TEXT
      - name: technical_use_case
        synonyms: [tech uc, use case type]
        description: "Prefixed category: AI:, Analytics:, DE:, Platform:, Apps & Collab:"
        expr: TECHNICAL_USE_CASE
        data_type: TEXT
      - name: eacv
        synonyms: [acv, opportunity value, deal value]
        description: Estimated Annual Contract Value in USD
        expr: USE_CASE_EACV
        data_type: NUMBER
      - name: partner_group
        synonyms: [group, partner type, segment]
        description: GSI | NOAM RSI | APJ RSI | EMEA RSI
        expr: >
          CASE
            WHEN PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC',
              'Cognizant Technology Solutions US Corp','Deloitte Consulting',
              'EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
            WHEN PARTNER_NAME IN ('7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc',
              'kipi.ai','Kipi.ai','evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
              'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
              'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC','Tiger Analytics Inc.',
              'Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle','Archetype Consulting',
              'Everforth Apex Systems','Tata Consultancy Services','OneSix','Icon Analytics',
              'Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies') THEN 'NOAM RSI'
            WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation',
              'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
              'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
            WHEN PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint',
              'CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
            ELSE 'Other'
          END
        data_type: TEXT

      # ── DELIVERY SURFACE (CLI / Desktop / UI) ───────────────────────────────
      # CRITICAL GRAIN WARNING. These are CUSTOMER-ACCOUNT level metrics, carried
      # unchanged on EVERY use case row belonging to that account. This table is
      # at USE CASE grain, so a plain SUM() over these columns MULTIPLIES each
      # account's usage by its number of use cases. On Q3 data SUM(CLI_CREDITS)
      # returns 417,109 when the true total is 219,604 — a 1.9x over-count.
      #
      # NEVER write SUM(CLI_CREDITS) / SUM(UI_CREDITS) / SUM(DESKTOP_CREDITS)
      # directly against this table. ALWAYS collapse to one row per account first:
      #   WITH acct AS (
      #     SELECT ACCOUNT_NAME_UPPER, MAX(CLI_CREDITS) AS CLI_CREDITS, ...
      #     FROM <this table> WHERE IS_COCO_FINAL = TRUE GROUP BY 1)
      #   SELECT SUM(CLI_CREDITS) FROM acct
      # See the verified queries named q3_surface_* for the correct pattern.
      #
      # There is NO use-case-level adoption % per surface — use cases are not
      # attributed to a surface. "Adoption by surface" means: of the accounts
      # attached to a CoCo use case, what share are active on that surface.
      # Accounts can be active on several surfaces, so those shares sum to >100%.
      - name: cli_credits
        synonyms: [cli, coco cli, command line, terminal, cli credits, cli spend]
        description: >
          ACCOUNT-GRAIN token credits used via the CoCo CLI. Repeated on every use
          case row for the account — dedupe by ACCOUNT_NAME_UPPER before summing.
        expr: CLI_CREDITS
        data_type: NUMBER
      - name: cli_tokens
        synonyms: [cli tokens, command line tokens]
        description: ACCOUNT-GRAIN tokens via CLI. Dedupe by account before summing.
        expr: CLI_TOKENS
        data_type: NUMBER
      - name: cli_requests
        synonyms: [cli requests, command line requests]
        description: ACCOUNT-GRAIN request count via CLI. Dedupe by account before summing.
        expr: CLI_REQUESTS
        data_type: NUMBER
      - name: desktop_credits
        synonyms: [desktop, coco desktop, desktop app, desktop credits, desktop spend]
        description: >
          ACCOUNT-GRAIN token credits used via CoCo Desktop. Repeated on every use
          case row for the account — dedupe by ACCOUNT_NAME_UPPER before summing.
        expr: DESKTOP_CREDITS
        data_type: NUMBER
      - name: desktop_tokens
        synonyms: [desktop tokens]
        description: ACCOUNT-GRAIN tokens via Desktop. Dedupe by account before summing.
        expr: DESKTOP_TOKENS
        data_type: NUMBER
      - name: desktop_requests
        synonyms: [desktop requests]
        description: ACCOUNT-GRAIN request count via Desktop. Dedupe by account before summing.
        expr: DESKTOP_REQUESTS
        data_type: NUMBER
      - name: ui_credits
        synonyms: [ui, web ui, snowsight, snowsight ui, ui credits, ui spend]
        description: >
          ACCOUNT-GRAIN token credits used via the CoCo UI (Snowsight). Repeated on
          every use case row for the account — dedupe by ACCOUNT_NAME_UPPER first.
        expr: UI_CREDITS
        data_type: NUMBER
      - name: ui_tokens
        synonyms: [ui tokens, snowsight tokens]
        description: ACCOUNT-GRAIN tokens via UI. Dedupe by account before summing.
        expr: UI_TOKENS
        data_type: NUMBER
      - name: ui_requests
        synonyms: [ui requests, snowsight requests]
        description: ACCOUNT-GRAIN request count via UI. Dedupe by account before summing.
        expr: UI_REQUESTS
        data_type: NUMBER
      - name: agent_requests
        synonyms: [coding agent requests, agent requests, agentic requests]
        description: >
          ACCOUNT-GRAIN UI coding-agent request count. Dedupe by account before summing.
        expr: AGENT_REQUESTS
        data_type: NUMBER
      - name: reasoning_agent_requests
        synonyms: [reasoning agent requests, reasoning requests]
        description: >
          ACCOUNT-GRAIN UI reasoning-agent request count. Dedupe by account before summing.
        expr: REASONING_AGENT_REQUESTS
        data_type: NUMBER

      - name: use_case_name
        synonyms: [uc name, use case title, name of the use case]
        description: Name of the use case as it appears in Salesforce.
        expr: USE_CASE_NAME
        data_type: TEXT
      - name: decision_date
        synonyms: [decision date, validation date, won date]
        description: >
          Date the use case reached a decision. This is the date column that
          scopes STAGES 3-4 ('3 - Technical / Business Validation',
          '4 - Use Case Won / Migration Plan'). Use it for any within-quarter date
          question about stages 3-4. Stages 5-7 use GO_LIVE_DATE instead.
        expr: DECISION_DATE
        data_type: DATE
      - name: go_live_date
        synonyms: [go live date, deployment date, live date, implementation date]
        description: >
          Date the use case went live. This is the date column that scopes
          STAGES 5-7 ('5 - Implementation In Progress', '6 - Implementation
          Complete', '7 - Deployed'). Use it for any within-quarter date question
          about stages 5-7. Stages 3-4 use DECISION_DATE instead.
        expr: GO_LIVE_DATE
        data_type: DATE
      - name: last_active
        synonyms: [last active, last activity, most recent usage, last seen]
        description: >
          ACCOUNT-GRAIN. Most recent date the customer account showed any CoCo
          usage. Repeated on every use case row for that account, so dedupe by
          ACCOUNT_NAME_UPPER before aggregating (use MAX, never SUM).
        expr: LAST_ACTIVE
        data_type: DATE
      - name: distinct_users
        synonyms: [distinct users, number of users, user count, how many users, seats]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of distinct users at the customer account who used CoCo.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: DISTINCT_USERS
        data_type: NUMBER
      - name: active_days
        synonyms: [active days, days active, usage days]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of days the customer account showed CoCo activity.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: ACTIVE_DAYS
        data_type: NUMBER
      - name: total_requests
        synonyms: [total requests, request count, all requests]
        description: >
          ACCOUNT-GRAIN engagement metric. Total CoCo requests from the customer account across all surfaces.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: TOTAL_REQUESTS
        data_type: NUMBER
      - name: tools_invoked
        synonyms: [tools invoked, tool invocations, tool calls, tool usage]
        description: >
          ACCOUNT-GRAIN engagement metric. Total tool invocations by the customer account.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: TOOLS_INVOKED
        data_type: NUMBER
      - name: custom_skills
        synonyms: [custom skills, custom skill count, bespoke skills, skills built]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of custom skills built by the customer account.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: CUSTOM_SKILLS
        data_type: NUMBER
      - name: relevant_skill_invocations
        synonyms: [relevant skill invocations, bundled skill usage, matching skill usage]
        description: >
          USE-CASE GRAIN. Invocations of bundled skills matching THIS use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (112 of 172 multi-use-case accounts show differing values). Do NOT
          deduplicate by account and do NOT treat it as an account total —
          aggregate it across use case rows normally.
        expr: RELEVANT_SKILL_INVOCATIONS
        data_type: NUMBER
      - name: relevant_custom_skills
        synonyms: [relevant custom skills, matching custom skills]
        description: >
          USE-CASE GRAIN. Custom skills matching THIS use case's WORKLOAD_CATEGORY,
          so it varies between use cases at the same account (81 of 172
          multi-use-case accounts differ). Do NOT deduplicate by account.
        expr: RELEVANT_CUSTOM_SKILLS
        data_type: NUMBER
      - name: total_score
        synonyms: [confidence score, usage score, score, total score, how confident]
        description: >
          USE-CASE GRAIN confidence score 0-100 — the numeric value behind
          CONFIDENCE_BAND (High >= 75, Medium 40-74, Low 1-39, No Signal 0).
          IS_COCO_FINAL is TRUE when IS_COCO is TRUE **or** this score is >= 75.
          Equals S1_SCORE + S2_SCORE + S3_SCORE + S4_SCORE.
          It DEPENDS ON the use case's WORKLOAD_CATEGORY, so two use cases at the
          same account can score differently (104 of 172 multi-use-case accounts
          differ). Do NOT deduplicate by account and never SUM it; report it per
          use case, or use AVG/MAX when rolling up.
        expr: TOTAL_SCORE
        data_type: NUMBER
      - name: s1_score
        synonyms: [s1, s1 score, skill relevance score]
        description: >
          USE-CASE GRAIN skill-relevance component (max 30) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (93 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S1_SCORE
        data_type: NUMBER
      - name: s2_score
        synonyms: [s2, s2 score, custom skill score]
        description: >
          USE-CASE GRAIN custom-skill component (max 35) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (38 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S2_SCORE
        data_type: NUMBER
      - name: s3_score
        synonyms: [s3, s3 score, tool usage score]
        description: >
          ACCOUNT-GRAIN tool-usage component (max 20) of TOTAL_SCORE. Unlike
          S1/S2/S4 this does not depend on WORKLOAD_CATEGORY, so it is identical
          across all use cases at an account — deduplicate by ACCOUNT_NAME_UPPER
          before aggregating. Use it to explain WHY an account scored as it did.
        expr: S3_SCORE
        data_type: NUMBER
      - name: s4_score
        synonyms: [s4, s4 score, intensity score]
        description: >
          USE-CASE GRAIN usage-intensity component (max 15) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (96 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S4_SCORE
        data_type: NUMBER
      - name: account_name_upper
        synonyms: [account key, uppercased account name, account join key]
        description: >
          Uppercased customer account name. THE DEDUPLICATION KEY for every
          ACCOUNT-GRAIN column (surface credits, engagement metrics, scores).
          GROUP BY this before aggregating any account-grain value.
        expr: ACCOUNT_NAME_UPPER
        data_type: TEXT
      - name: quarter_credits
        synonyms: [credits, token credits, credit spend, quarter credits, spend]
        description: >
          ACCOUNT-GRAIN. Total CoCo token credits for THIS table's quarter. The column is named Q2_CREDITS for historical reasons but holds the quarter of THIS table (Q3 table = Q3 credits). It is NOT specific to Q2.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: Q2_CREDITS
        data_type: NUMBER
      - name: quarter_tokens
        synonyms: [tokens, token usage, token consumption, quarter tokens]
        description: >
          ACCOUNT-GRAIN. Total CoCo tokens for THIS table's quarter. Named Q2_TOKENS for historical reasons but holds the quarter of THIS table. NOT specific to Q2.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: Q2_TOKENS
        data_type: NUMBER
      - name: last7_credits
        synonyms: [last 7 days credits, recent credits, last week credits]
        description: >
          ACCOUNT-GRAIN. Credits in the trailing 7 days. Pair with PRIOR7_CREDITS for week-over-week.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: LAST7_CREDITS
        data_type: NUMBER
      - name: prior7_credits
        synonyms: [prior 7 days credits, previous week credits]
        description: >
          ACCOUNT-GRAIN. Credits in the 7 days before last. WoW% = (LAST7-PRIOR7)/PRIOR7*100.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: PRIOR7_CREDITS
        data_type: NUMBER
      - name: last7_tokens
        synonyms: [last 7 days tokens, recent tokens, last week tokens]
        description: >
          ACCOUNT-GRAIN. Tokens in the trailing 7 days. Pair with PRIOR7_TOKENS for week-over-week.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: LAST7_TOKENS
        data_type: NUMBER
      - name: prior7_tokens
        synonyms: [prior 7 days tokens, previous week tokens]
        description: >
          ACCOUNT-GRAIN. Tokens in the 7 days before last. WoW% = (LAST7-PRIOR7)/PRIOR7*100.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: PRIOR7_TOKENS
        data_type: NUMBER
    measures:
      - name: total_use_cases
        synonyms: [number of use cases, uc count, total UCs, all use cases]
        description: Total use cases regardless of CoCo status
        expr: COUNT(USE_CASE_ID)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_use_cases
        synonyms: [coco use cases, IS_COCO_FINAL count, coco count, coco UCs, coco qualified, attributed UCs]
        description: IS_COCO_FINAL = TRUE count. THE DEFAULT COCO METRIC.
        expr: COUNT_IF(IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_pct
        synonyms: [coco rate, coco attachment rate, coco %, adoption rate]
        description: IS_COCO_FINAL % of total. Target 75% GSI/NOAM RSI, 50% APJ/EMEA RSI.
        expr: ROUND(COUNT_IF(IS_COCO_FINAL = TRUE) * 100.0 / NULLIF(COUNT(USE_CASE_ID), 0), 1)
        data_type: NUMBER
        default_aggregation: sum
      - name: deployed_use_cases
        synonyms: [stage 7 count, deployed, go-lives]
        description: Stage 7 Deployed count
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed')
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_deployed
        synonyms: [coco go-lives, coco deployed, deployed with coco]
        description: Deployed IS_COCO_FINAL use cases
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed' AND IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: total_eacv
        synonyms: [total ACV, pipeline value, total revenue]
        description: Total eACV in USD
        expr: SUM(USE_CASE_EACV)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_eacv
        synonyms: [coco ACV, coco revenue, coco pipeline value]
        description: eACV of IS_COCO_FINAL use cases
        expr: SUM(CASE WHEN IS_COCO_FINAL = TRUE THEN USE_CASE_EACV ELSE 0 END)
        data_type: NUMBER
        default_aggregation: sum
      - name: distinct_partners
        synonyms: [partner count, number of partners, unique partners]
        description: Count of distinct partner companies
        expr: COUNT(DISTINCT PARTNER_NAME)
        data_type: NUMBER
        default_aggregation: sum

  - name: use_cases_q2
    description: >
      Q2 FY27 (May-Jul 2026, LAST QUARTER). Scored from May 1 2026.
      Pre-scoped to Q2 — no date filter needed. Matches dashboard Q2 numbers exactly.
      Same columns and IS_COCO_FINAL definition as use_cases_q3.
    base_table:
      database: TEMP
      schema: COCO_PARTNER_ADOPTION
      table: V_OKR_USE_CASES_COCO_FINAL_Q2
    filters:
      - name: managed_partners
        synonyms: [managed, OKR partners, tracked]
        description: All ~44 managed partners
        expr: >
          PARTNER_NAME IN (
            'Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp',
            'Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting',
            '7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc','kipi.ai','Kipi.ai',
            'evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
            'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
            'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC',
            'Tiger Analytics Inc.','Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle',
            'Archetype Consulting','Everforth Apex Systems','Tata Consultancy Services',
            'OneSix','Icon Analytics','Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies',
            'NTT DATA Group Corporation','MegazoneCloud Corporation',
            'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
            'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation',
            'INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.',
            'Kubrick Group','KPC (Key Performance Consulting)','KPC'
          )
      - name: is_coco_final
        synonyms: [coco attributed, IS_COCO_FINAL, coco qualified, coco final]
        description: IS_COCO_FINAL = TRUE. Default CoCo filter.
        expr: IS_COCO_FINAL = TRUE
      - name: usmajors_theater
        synonyms: [USMajors, US Majors, S Majors, Majors]
        description: USMajors theater
        expr: THEATER_NAME = 'USMajors'
    dimensions:
      - name: partner_name
        synonyms: [partner, SI, company]
        description: Partner name
        expr: PARTNER_NAME
        data_type: TEXT
      - name: account_name
        synonyms: [customer, account]
        description: Customer account name
        expr: ACCOUNT_NAME
        data_type: TEXT
      - name: use_case_id
        synonyms: [uc id]
        description: Use case identifier
        expr: USE_CASE_ID
        data_type: TEXT
      - name: use_case_stage
        synonyms: [stage, status]
        description: Use case stage — never use numeric values
        expr: USE_CASE_STAGE
        data_type: TEXT
      - name: theater
        synonyms: [theater name, geo]
        description: USMajors=S Majors. AMSExpansion, AMSAcquisition, USPubSec=NoAM.
        expr: THEATER_NAME
        data_type: TEXT
      - name: region
        synonyms: [region name, sub-region, country, industry, vertical, sub category, subcategory, additional breakdown, theatre breakdown, theater breakdown, breakdown within theatre, next level breakdown]
        description: "Next level of the sales hierarchy BELOW theater - the theater breakdown / sub-category. Its meaning depends on the theater: USMajors=INDUSTRY (HCLS, FSI, FSIGlobal, TMT, MFG, RCG); USPubSec=government tier (Federal, SLED); APJ=country (ANZ, India, ASEAN, Japan, Korea, China); EMEA=sub-geography (CentralEMEA, SouthEMEA, NorthEMEA, UK, META, EMEACommercial); AMSExpansion=US/Canada geography (CentralExp, NortheastExp, SoutheastExp, SouthwestExp, NorthwestExp, USGrowthExp, CanadaExp, Commercial); AMSAcquisition=segment x geography (EntAcq/CommAcq East|West|Central, MajorsAcq, LATAM). ALWAYS use this to break a single theater down further - e.g. 'US Majors breakdown' means GROUP BY region WHERE theater='USMajors'. Do NOT group by theater to break down one theater."
        expr: REGION_NAME
        data_type: TEXT
      - name: is_coco_final
        synonyms: [IS_COCO_FINAL, coco final, coco qualified]
        description: TRUE = CoCo attributed. Always filter = TRUE for CoCo counts.
        expr: IS_COCO_FINAL
        data_type: BOOLEAN
      - name: confidence_band
        synonyms: [confidence, score band]
        description: "High(>=75) | Medium(40-74) | Low(1-39) | No Signal"
        expr: CONFIDENCE_BAND
        data_type: TEXT
      - name: partner_group
        synonyms: [group, partner type]
        description: GSI | NOAM RSI | APJ RSI | EMEA RSI
        expr: >
          CASE
            WHEN PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC',
              'Cognizant Technology Solutions US Corp','Deloitte Consulting',
              'EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
            WHEN PARTNER_NAME IN ('7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc',
              'kipi.ai','Kipi.ai','evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
              'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
              'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC','Tiger Analytics Inc.',
              'Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle','Archetype Consulting',
              'Everforth Apex Systems','Tata Consultancy Services','OneSix','Icon Analytics',
              'Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies') THEN 'NOAM RSI'
            WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation',
              'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
              'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
            WHEN PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint',
              'CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
            ELSE 'Other'
          END
        data_type: TEXT

      # ── Backfilled for parity with use_cases_q3 ──────────────────────────
      # ACCOUNT-GRAIN fields (surface, engagement, scores) must be deduplicated
      # by ACCOUNT_NAME_UPPER before aggregating — a plain SUM over use case rows
      # over-counts them. See the grain warning block under use_cases_q3.
      - name: use_case_name
        synonyms: [uc name, use case title, name of the use case]
        description: Name of the use case as it appears in Salesforce.
        expr: USE_CASE_NAME
        data_type: TEXT
      - name: decision_date
        synonyms: [decision date, validation date, won date]
        description: >
          Date the use case reached a decision. This is the date column that
          scopes STAGES 3-4 ('3 - Technical / Business Validation',
          '4 - Use Case Won / Migration Plan'). Use it for any within-quarter date
          question about stages 3-4. Stages 5-7 use GO_LIVE_DATE instead.
        expr: DECISION_DATE
        data_type: DATE
      - name: go_live_date
        synonyms: [go live date, deployment date, live date, implementation date]
        description: >
          Date the use case went live. This is the date column that scopes
          STAGES 5-7 ('5 - Implementation In Progress', '6 - Implementation
          Complete', '7 - Deployed'). Use it for any within-quarter date question
          about stages 5-7. Stages 3-4 use DECISION_DATE instead.
        expr: GO_LIVE_DATE
        data_type: DATE
      - name: last_active
        synonyms: [last active, last activity, most recent usage, last seen]
        description: >
          ACCOUNT-GRAIN. Most recent date the customer account showed any CoCo
          usage. Repeated on every use case row for that account, so dedupe by
          ACCOUNT_NAME_UPPER before aggregating (use MAX, never SUM).
        expr: LAST_ACTIVE
        data_type: DATE
      - name: distinct_users
        synonyms: [distinct users, number of users, user count, how many users, seats]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of distinct users at the customer account who used CoCo.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: DISTINCT_USERS
        data_type: NUMBER
      - name: active_days
        synonyms: [active days, days active, usage days]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of days the customer account showed CoCo activity.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: ACTIVE_DAYS
        data_type: NUMBER
      - name: total_requests
        synonyms: [total requests, request count, all requests]
        description: >
          ACCOUNT-GRAIN engagement metric. Total CoCo requests from the customer account across all surfaces.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: TOTAL_REQUESTS
        data_type: NUMBER
      - name: tools_invoked
        synonyms: [tools invoked, tool invocations, tool calls, tool usage]
        description: >
          ACCOUNT-GRAIN engagement metric. Total tool invocations by the customer account.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: TOOLS_INVOKED
        data_type: NUMBER
      - name: custom_skills
        synonyms: [custom skills, custom skill count, bespoke skills, skills built]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of custom skills built by the customer account.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: CUSTOM_SKILLS
        data_type: NUMBER
      - name: relevant_skill_invocations
        synonyms: [relevant skill invocations, bundled skill usage, matching skill usage]
        description: >
          USE-CASE GRAIN. Invocations of bundled skills matching THIS use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (112 of 172 multi-use-case accounts show differing values). Do NOT
          deduplicate by account and do NOT treat it as an account total —
          aggregate it across use case rows normally.
        expr: RELEVANT_SKILL_INVOCATIONS
        data_type: NUMBER
      - name: relevant_custom_skills
        synonyms: [relevant custom skills, matching custom skills]
        description: >
          USE-CASE GRAIN. Custom skills matching THIS use case's WORKLOAD_CATEGORY,
          so it varies between use cases at the same account (81 of 172
          multi-use-case accounts differ). Do NOT deduplicate by account.
        expr: RELEVANT_CUSTOM_SKILLS
        data_type: NUMBER
      - name: total_score
        synonyms: [confidence score, usage score, score, total score, how confident]
        description: >
          USE-CASE GRAIN confidence score 0-100 — the numeric value behind
          CONFIDENCE_BAND (High >= 75, Medium 40-74, Low 1-39, No Signal 0).
          IS_COCO_FINAL is TRUE when IS_COCO is TRUE **or** this score is >= 75.
          Equals S1_SCORE + S2_SCORE + S3_SCORE + S4_SCORE.
          It DEPENDS ON the use case's WORKLOAD_CATEGORY, so two use cases at the
          same account can score differently (104 of 172 multi-use-case accounts
          differ). Do NOT deduplicate by account and never SUM it; report it per
          use case, or use AVG/MAX when rolling up.
        expr: TOTAL_SCORE
        data_type: NUMBER
      - name: s1_score
        synonyms: [s1, s1 score, skill relevance score]
        description: >
          USE-CASE GRAIN skill-relevance component (max 30) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (93 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S1_SCORE
        data_type: NUMBER
      - name: s2_score
        synonyms: [s2, s2 score, custom skill score]
        description: >
          USE-CASE GRAIN custom-skill component (max 35) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (38 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S2_SCORE
        data_type: NUMBER
      - name: s3_score
        synonyms: [s3, s3 score, tool usage score]
        description: >
          ACCOUNT-GRAIN tool-usage component (max 20) of TOTAL_SCORE. Unlike
          S1/S2/S4 this does not depend on WORKLOAD_CATEGORY, so it is identical
          across all use cases at an account — deduplicate by ACCOUNT_NAME_UPPER
          before aggregating. Use it to explain WHY an account scored as it did.
        expr: S3_SCORE
        data_type: NUMBER
      - name: s4_score
        synonyms: [s4, s4 score, intensity score]
        description: >
          USE-CASE GRAIN usage-intensity component (max 15) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (96 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S4_SCORE
        data_type: NUMBER
      - name: account_name_upper
        synonyms: [account key, uppercased account name, account join key]
        description: >
          Uppercased customer account name. THE DEDUPLICATION KEY for every
          ACCOUNT-GRAIN column (surface credits, engagement metrics, scores).
          GROUP BY this before aggregating any account-grain value.
        expr: ACCOUNT_NAME_UPPER
        data_type: TEXT
      - name: quarter_credits
        synonyms: [credits, token credits, credit spend, quarter credits, spend]
        description: >
          ACCOUNT-GRAIN. Total CoCo token credits for THIS table's quarter. The column is named Q2_CREDITS for historical reasons but holds the quarter of THIS table (Q3 table = Q3 credits). It is NOT specific to Q2.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: Q2_CREDITS
        data_type: NUMBER
      - name: quarter_tokens
        synonyms: [tokens, token usage, token consumption, quarter tokens]
        description: >
          ACCOUNT-GRAIN. Total CoCo tokens for THIS table's quarter. Named Q2_TOKENS for historical reasons but holds the quarter of THIS table. NOT specific to Q2.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: Q2_TOKENS
        data_type: NUMBER
      - name: last7_credits
        synonyms: [last 7 days credits, recent credits, last week credits]
        description: >
          ACCOUNT-GRAIN. Credits in the trailing 7 days. Pair with PRIOR7_CREDITS for week-over-week.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: LAST7_CREDITS
        data_type: NUMBER
      - name: prior7_credits
        synonyms: [prior 7 days credits, previous week credits]
        description: >
          ACCOUNT-GRAIN. Credits in the 7 days before last. WoW% = (LAST7-PRIOR7)/PRIOR7*100.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: PRIOR7_CREDITS
        data_type: NUMBER
      - name: last7_tokens
        synonyms: [last 7 days tokens, recent tokens, last week tokens]
        description: >
          ACCOUNT-GRAIN. Tokens in the trailing 7 days. Pair with PRIOR7_TOKENS for week-over-week.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: LAST7_TOKENS
        data_type: NUMBER
      - name: prior7_tokens
        synonyms: [prior 7 days tokens, previous week tokens]
        description: >
          ACCOUNT-GRAIN. Tokens in the 7 days before last. WoW% = (LAST7-PRIOR7)/PRIOR7*100.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: PRIOR7_TOKENS
        data_type: NUMBER
      - name: is_coco_keyword
        synonyms: [IS_COCO, keyword coco, se tagged]
        description: Keyword/flag only — SE comments, partner #coco, feature flag
        expr: IS_COCO
        data_type: BOOLEAN
      - name: coco_source
        synonyms: [attribution source, detection method]
        description: SE_COMMENTS | PARTNER_COMMENTS | FEATURE_FLAG | MULTIPLE
        expr: COCO_SOURCE
        data_type: TEXT
      - name: workload_category
        synonyms: [workload, domain, category]
        description: "AI | Analytics | Data Engineering | Platform | Apps & Collab | Migration"
        expr: WORKLOAD_CATEGORY
        data_type: TEXT
      - name: technical_use_case
        synonyms: [tech uc, use case type]
        description: "Prefixed category: AI:, Analytics:, DE:, Platform:, Apps & Collab:"
        expr: TECHNICAL_USE_CASE
        data_type: TEXT
      - name: eacv
        synonyms: [acv, opportunity value, deal value]
        description: Estimated Annual Contract Value in USD
        expr: USE_CASE_EACV
        data_type: NUMBER
      - name: cli_credits
        synonyms: [cli, coco cli, command line, terminal, cli credits, cli spend]
        description: >
          ACCOUNT-GRAIN token credits used via the CoCo CLI. Repeated on every use
          case row for the account — dedupe by ACCOUNT_NAME_UPPER before summing.
        expr: CLI_CREDITS
        data_type: NUMBER
      - name: cli_tokens
        synonyms: [cli tokens, command line tokens]
        description: ACCOUNT-GRAIN tokens via CLI. Dedupe by account before summing.
        expr: CLI_TOKENS
        data_type: NUMBER
      - name: cli_requests
        synonyms: [cli requests, command line requests]
        description: ACCOUNT-GRAIN request count via CLI. Dedupe by account before summing.
        expr: CLI_REQUESTS
        data_type: NUMBER
      - name: desktop_credits
        synonyms: [desktop, coco desktop, desktop app, desktop credits, desktop spend]
        description: >
          ACCOUNT-GRAIN token credits used via CoCo Desktop. Repeated on every use
          case row for the account — dedupe by ACCOUNT_NAME_UPPER before summing.
        expr: DESKTOP_CREDITS
        data_type: NUMBER
      - name: desktop_tokens
        synonyms: [desktop tokens]
        description: ACCOUNT-GRAIN tokens via Desktop. Dedupe by account before summing.
        expr: DESKTOP_TOKENS
        data_type: NUMBER
      - name: desktop_requests
        synonyms: [desktop requests]
        description: ACCOUNT-GRAIN request count via Desktop. Dedupe by account before summing.
        expr: DESKTOP_REQUESTS
        data_type: NUMBER
      - name: ui_credits
        synonyms: [ui, web ui, snowsight, snowsight ui, ui credits, ui spend]
        description: >
          ACCOUNT-GRAIN token credits used via the CoCo UI (Snowsight). Repeated on
          every use case row for the account — dedupe by ACCOUNT_NAME_UPPER first.
        expr: UI_CREDITS
        data_type: NUMBER
      - name: ui_tokens
        synonyms: [ui tokens, snowsight tokens]
        description: ACCOUNT-GRAIN tokens via UI. Dedupe by account before summing.
        expr: UI_TOKENS
        data_type: NUMBER
      - name: ui_requests
        synonyms: [ui requests, snowsight requests]
        description: ACCOUNT-GRAIN request count via UI. Dedupe by account before summing.
        expr: UI_REQUESTS
        data_type: NUMBER
      - name: agent_requests
        synonyms: [coding agent requests, agent requests, agentic requests]
        description: >
          ACCOUNT-GRAIN UI coding-agent request count. Dedupe by account before summing.
        expr: AGENT_REQUESTS
        data_type: NUMBER
      - name: reasoning_agent_requests
        synonyms: [reasoning agent requests, reasoning requests]
        description: >
          ACCOUNT-GRAIN UI reasoning-agent request count. Dedupe by account before summing.
        expr: REASONING_AGENT_REQUESTS
        data_type: NUMBER
    measures:
      - name: total_use_cases
        synonyms: [number of use cases, uc count, total UCs]
        description: Total use cases
        expr: COUNT(USE_CASE_ID)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_use_cases
        synonyms: [coco use cases, IS_COCO_FINAL count, coco count, coco UCs, coco qualified]
        description: IS_COCO_FINAL = TRUE count — default CoCo metric
        expr: COUNT_IF(IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_pct
        synonyms: [coco rate, coco %, adoption rate]
        description: IS_COCO_FINAL % of total
        expr: ROUND(COUNT_IF(IS_COCO_FINAL = TRUE) * 100.0 / NULLIF(COUNT(USE_CASE_ID), 0), 1)
        data_type: NUMBER
        default_aggregation: sum
      - name: deployed_use_cases
        synonyms: [stage 7 count, deployed, go-lives]
        description: Stage 7 Deployed count
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed')
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_deployed
        synonyms: [coco go-lives, coco deployed]
        description: Deployed IS_COCO_FINAL use cases
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed' AND IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: total_eacv
        synonyms: [total ACV, pipeline value, total revenue]
        description: Total eACV in USD
        expr: SUM(USE_CASE_EACV)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_eacv
        synonyms: [coco ACV, coco revenue, coco pipeline value]
        description: eACV of IS_COCO_FINAL use cases
        expr: SUM(CASE WHEN IS_COCO_FINAL = TRUE THEN USE_CASE_EACV ELSE 0 END)
        data_type: NUMBER
        default_aggregation: sum
      - name: distinct_partners
        synonyms: [partner count, number of partners, unique partners]
        description: Count of distinct partner companies
        expr: COUNT(DISTINCT PARTNER_NAME)
        data_type: NUMBER
        default_aggregation: sum

  - name: use_cases_q1
    description: >
      Q1 FY27 (Feb-Apr 2026). Scored from Feb 1 2026.
      Pre-scoped to Q1 — no date filter needed.
      Same structure as use_cases_q3.
    base_table:
      database: TEMP
      schema: COCO_PARTNER_ADOPTION
      table: V_OKR_USE_CASES_COCO_FINAL_Q1
    filters:
      - name: managed_partners
        synonyms: [managed, OKR partners]
        description: All ~44 managed partners
        expr: >
          PARTNER_NAME IN (
            'Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp',
            'Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting',
            '7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc','kipi.ai','Kipi.ai',
            'evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
            'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
            'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC',
            'Tiger Analytics Inc.','Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle',
            'Archetype Consulting','Everforth Apex Systems','Tata Consultancy Services',
            'OneSix','Icon Analytics','Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies',
            'NTT DATA Group Corporation','MegazoneCloud Corporation',
            'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
            'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation',
            'INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.',
            'Kubrick Group','KPC (Key Performance Consulting)','KPC'
          )
      - name: is_coco_final
        synonyms: [IS_COCO_FINAL, coco qualified, coco final]
        description: IS_COCO_FINAL = TRUE. Default CoCo filter.
        expr: IS_COCO_FINAL = TRUE
    dimensions:
      - name: partner_name
        synonyms: [partner, SI, company]
        description: Partner name
        expr: PARTNER_NAME
        data_type: TEXT
      - name: use_case_id
        synonyms: [uc id]
        description: Use case identifier
        expr: USE_CASE_ID
        data_type: TEXT
      - name: use_case_stage
        synonyms: [stage, status]
        description: Use case stage
        expr: USE_CASE_STAGE
        data_type: TEXT
      - name: theater
        synonyms: [theater name, geo]
        description: Sales theater
        expr: THEATER_NAME
        data_type: TEXT
      - name: region
        synonyms: [region name, sub-region, country, industry, vertical, sub category, subcategory, additional breakdown, theatre breakdown, theater breakdown, breakdown within theatre, next level breakdown]
        description: "Next level of the sales hierarchy BELOW theater - the theater breakdown / sub-category. Its meaning depends on the theater: USMajors=INDUSTRY (HCLS, FSI, FSIGlobal, TMT, MFG, RCG); USPubSec=government tier (Federal, SLED); APJ=country (ANZ, India, ASEAN, Japan, Korea, China); EMEA=sub-geography (CentralEMEA, SouthEMEA, NorthEMEA, UK, META, EMEACommercial); AMSExpansion=US/Canada geography (CentralExp, NortheastExp, SoutheastExp, SouthwestExp, NorthwestExp, USGrowthExp, CanadaExp, Commercial); AMSAcquisition=segment x geography (EntAcq/CommAcq East|West|Central, MajorsAcq, LATAM). ALWAYS use this to break a single theater down further - e.g. 'US Majors breakdown' means GROUP BY region WHERE theater='USMajors'. Do NOT group by theater to break down one theater."
        expr: REGION_NAME
        data_type: TEXT
      - name: is_coco_final
        synonyms: [IS_COCO_FINAL, coco final]
        description: TRUE = CoCo attributed
        expr: IS_COCO_FINAL
        data_type: BOOLEAN
      - name: partner_group
        synonyms: [group, partner type]
        description: GSI | NOAM RSI | APJ RSI | EMEA RSI
        expr: >
          CASE
            WHEN PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC',
              'Cognizant Technology Solutions US Corp','Deloitte Consulting',
              'EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
            WHEN PARTNER_NAME IN ('7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc',
              'kipi.ai','Kipi.ai','evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
              'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
              'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC','Tiger Analytics Inc.',
              'Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle','Archetype Consulting',
              'Everforth Apex Systems','Tata Consultancy Services','OneSix','Icon Analytics',
              'Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies') THEN 'NOAM RSI'
            WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation',
              'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
              'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
            WHEN PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint',
              'CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
            ELSE 'Other'
          END
        data_type: TEXT

      # ── Backfilled for parity with use_cases_q3 ──────────────────────────
      # ACCOUNT-GRAIN fields (surface, engagement, scores) must be deduplicated
      # by ACCOUNT_NAME_UPPER before aggregating — a plain SUM over use case rows
      # over-counts them. See the grain warning block under use_cases_q3.
      - name: use_case_name
        synonyms: [uc name, use case title, name of the use case]
        description: Name of the use case as it appears in Salesforce.
        expr: USE_CASE_NAME
        data_type: TEXT
      - name: decision_date
        synonyms: [decision date, validation date, won date]
        description: >
          Date the use case reached a decision. This is the date column that
          scopes STAGES 3-4 ('3 - Technical / Business Validation',
          '4 - Use Case Won / Migration Plan'). Use it for any within-quarter date
          question about stages 3-4. Stages 5-7 use GO_LIVE_DATE instead.
        expr: DECISION_DATE
        data_type: DATE
      - name: go_live_date
        synonyms: [go live date, deployment date, live date, implementation date]
        description: >
          Date the use case went live. This is the date column that scopes
          STAGES 5-7 ('5 - Implementation In Progress', '6 - Implementation
          Complete', '7 - Deployed'). Use it for any within-quarter date question
          about stages 5-7. Stages 3-4 use DECISION_DATE instead.
        expr: GO_LIVE_DATE
        data_type: DATE
      - name: last_active
        synonyms: [last active, last activity, most recent usage, last seen]
        description: >
          ACCOUNT-GRAIN. Most recent date the customer account showed any CoCo
          usage. Repeated on every use case row for that account, so dedupe by
          ACCOUNT_NAME_UPPER before aggregating (use MAX, never SUM).
        expr: LAST_ACTIVE
        data_type: DATE
      - name: distinct_users
        synonyms: [distinct users, number of users, user count, how many users, seats]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of distinct users at the customer account who used CoCo.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: DISTINCT_USERS
        data_type: NUMBER
      - name: active_days
        synonyms: [active days, days active, usage days]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of days the customer account showed CoCo activity.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: ACTIVE_DAYS
        data_type: NUMBER
      - name: total_requests
        synonyms: [total requests, request count, all requests]
        description: >
          ACCOUNT-GRAIN engagement metric. Total CoCo requests from the customer account across all surfaces.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: TOTAL_REQUESTS
        data_type: NUMBER
      - name: tools_invoked
        synonyms: [tools invoked, tool invocations, tool calls, tool usage]
        description: >
          ACCOUNT-GRAIN engagement metric. Total tool invocations by the customer account.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: TOOLS_INVOKED
        data_type: NUMBER
      - name: custom_skills
        synonyms: [custom skills, custom skill count, bespoke skills, skills built]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of custom skills built by the customer account.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: CUSTOM_SKILLS
        data_type: NUMBER
      - name: relevant_skill_invocations
        synonyms: [relevant skill invocations, bundled skill usage, matching skill usage]
        description: >
          USE-CASE GRAIN. Invocations of bundled skills matching THIS use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (112 of 172 multi-use-case accounts show differing values). Do NOT
          deduplicate by account and do NOT treat it as an account total —
          aggregate it across use case rows normally.
        expr: RELEVANT_SKILL_INVOCATIONS
        data_type: NUMBER
      - name: relevant_custom_skills
        synonyms: [relevant custom skills, matching custom skills]
        description: >
          USE-CASE GRAIN. Custom skills matching THIS use case's WORKLOAD_CATEGORY,
          so it varies between use cases at the same account (81 of 172
          multi-use-case accounts differ). Do NOT deduplicate by account.
        expr: RELEVANT_CUSTOM_SKILLS
        data_type: NUMBER
      - name: total_score
        synonyms: [confidence score, usage score, score, total score, how confident]
        description: >
          USE-CASE GRAIN confidence score 0-100 — the numeric value behind
          CONFIDENCE_BAND (High >= 75, Medium 40-74, Low 1-39, No Signal 0).
          IS_COCO_FINAL is TRUE when IS_COCO is TRUE **or** this score is >= 75.
          Equals S1_SCORE + S2_SCORE + S3_SCORE + S4_SCORE.
          It DEPENDS ON the use case's WORKLOAD_CATEGORY, so two use cases at the
          same account can score differently (104 of 172 multi-use-case accounts
          differ). Do NOT deduplicate by account and never SUM it; report it per
          use case, or use AVG/MAX when rolling up.
        expr: TOTAL_SCORE
        data_type: NUMBER
      - name: s1_score
        synonyms: [s1, s1 score, skill relevance score]
        description: >
          USE-CASE GRAIN skill-relevance component (max 30) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (93 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S1_SCORE
        data_type: NUMBER
      - name: s2_score
        synonyms: [s2, s2 score, custom skill score]
        description: >
          USE-CASE GRAIN custom-skill component (max 35) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (38 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S2_SCORE
        data_type: NUMBER
      - name: s3_score
        synonyms: [s3, s3 score, tool usage score]
        description: >
          ACCOUNT-GRAIN tool-usage component (max 20) of TOTAL_SCORE. Unlike
          S1/S2/S4 this does not depend on WORKLOAD_CATEGORY, so it is identical
          across all use cases at an account — deduplicate by ACCOUNT_NAME_UPPER
          before aggregating. Use it to explain WHY an account scored as it did.
        expr: S3_SCORE
        data_type: NUMBER
      - name: s4_score
        synonyms: [s4, s4 score, intensity score]
        description: >
          USE-CASE GRAIN usage-intensity component (max 15) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (96 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S4_SCORE
        data_type: NUMBER
      - name: account_name_upper
        synonyms: [account key, uppercased account name, account join key]
        description: >
          Uppercased customer account name. THE DEDUPLICATION KEY for every
          ACCOUNT-GRAIN column (surface credits, engagement metrics, scores).
          GROUP BY this before aggregating any account-grain value.
        expr: ACCOUNT_NAME_UPPER
        data_type: TEXT
      - name: quarter_credits
        synonyms: [credits, token credits, credit spend, quarter credits, spend]
        description: >
          ACCOUNT-GRAIN. Total CoCo token credits for THIS table's quarter. The column is named Q2_CREDITS for historical reasons but holds the quarter of THIS table (Q3 table = Q3 credits). It is NOT specific to Q2.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: Q2_CREDITS
        data_type: NUMBER
      - name: quarter_tokens
        synonyms: [tokens, token usage, token consumption, quarter tokens]
        description: >
          ACCOUNT-GRAIN. Total CoCo tokens for THIS table's quarter. Named Q2_TOKENS for historical reasons but holds the quarter of THIS table. NOT specific to Q2.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: Q2_TOKENS
        data_type: NUMBER
      - name: last7_credits
        synonyms: [last 7 days credits, recent credits, last week credits]
        description: >
          ACCOUNT-GRAIN. Credits in the trailing 7 days. Pair with PRIOR7_CREDITS for week-over-week.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: LAST7_CREDITS
        data_type: NUMBER
      - name: prior7_credits
        synonyms: [prior 7 days credits, previous week credits]
        description: >
          ACCOUNT-GRAIN. Credits in the 7 days before last. WoW% = (LAST7-PRIOR7)/PRIOR7*100.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: PRIOR7_CREDITS
        data_type: NUMBER
      - name: last7_tokens
        synonyms: [last 7 days tokens, recent tokens, last week tokens]
        description: >
          ACCOUNT-GRAIN. Tokens in the trailing 7 days. Pair with PRIOR7_TOKENS for week-over-week.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: LAST7_TOKENS
        data_type: NUMBER
      - name: prior7_tokens
        synonyms: [prior 7 days tokens, previous week tokens]
        description: >
          ACCOUNT-GRAIN. Tokens in the 7 days before last. WoW% = (LAST7-PRIOR7)/PRIOR7*100.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: PRIOR7_TOKENS
        data_type: NUMBER
      - name: account_name
        synonyms: [customer, account]
        description: Customer account name
        expr: ACCOUNT_NAME
        data_type: TEXT
      - name: is_coco_keyword
        synonyms: [IS_COCO, keyword coco, se tagged]
        description: Keyword/flag only — SE comments, partner #coco, feature flag
        expr: IS_COCO
        data_type: BOOLEAN
      - name: confidence_band
        synonyms: [confidence, score band]
        description: "High(>=75)=IS_COCO_FINAL. Medium(40-74). Low(1-39). No Signal(0)."
        expr: CONFIDENCE_BAND
        data_type: TEXT
      - name: coco_source
        synonyms: [attribution source, detection method]
        description: SE_COMMENTS | PARTNER_COMMENTS | FEATURE_FLAG | MULTIPLE
        expr: COCO_SOURCE
        data_type: TEXT
      - name: workload_category
        synonyms: [workload, domain, category]
        description: "AI | Analytics | Data Engineering | Platform | Apps & Collab | Migration"
        expr: WORKLOAD_CATEGORY
        data_type: TEXT
      - name: technical_use_case
        synonyms: [tech uc, use case type]
        description: "Prefixed category: AI:, Analytics:, DE:, Platform:, Apps & Collab:"
        expr: TECHNICAL_USE_CASE
        data_type: TEXT
      - name: eacv
        synonyms: [acv, opportunity value, deal value]
        description: Estimated Annual Contract Value in USD
        expr: USE_CASE_EACV
        data_type: NUMBER
      - name: cli_credits
        synonyms: [cli, coco cli, command line, terminal, cli credits, cli spend]
        description: >
          ACCOUNT-GRAIN token credits used via the CoCo CLI. Repeated on every use
          case row for the account — dedupe by ACCOUNT_NAME_UPPER before summing.
        expr: CLI_CREDITS
        data_type: NUMBER
      - name: cli_tokens
        synonyms: [cli tokens, command line tokens]
        description: ACCOUNT-GRAIN tokens via CLI. Dedupe by account before summing.
        expr: CLI_TOKENS
        data_type: NUMBER
      - name: cli_requests
        synonyms: [cli requests, command line requests]
        description: ACCOUNT-GRAIN request count via CLI. Dedupe by account before summing.
        expr: CLI_REQUESTS
        data_type: NUMBER
      - name: desktop_credits
        synonyms: [desktop, coco desktop, desktop app, desktop credits, desktop spend]
        description: >
          ACCOUNT-GRAIN token credits used via CoCo Desktop. Repeated on every use
          case row for the account — dedupe by ACCOUNT_NAME_UPPER before summing.
        expr: DESKTOP_CREDITS
        data_type: NUMBER
      - name: desktop_tokens
        synonyms: [desktop tokens]
        description: ACCOUNT-GRAIN tokens via Desktop. Dedupe by account before summing.
        expr: DESKTOP_TOKENS
        data_type: NUMBER
      - name: desktop_requests
        synonyms: [desktop requests]
        description: ACCOUNT-GRAIN request count via Desktop. Dedupe by account before summing.
        expr: DESKTOP_REQUESTS
        data_type: NUMBER
      - name: ui_credits
        synonyms: [ui, web ui, snowsight, snowsight ui, ui credits, ui spend]
        description: >
          ACCOUNT-GRAIN token credits used via the CoCo UI (Snowsight). Repeated on
          every use case row for the account — dedupe by ACCOUNT_NAME_UPPER first.
        expr: UI_CREDITS
        data_type: NUMBER
      - name: ui_tokens
        synonyms: [ui tokens, snowsight tokens]
        description: ACCOUNT-GRAIN tokens via UI. Dedupe by account before summing.
        expr: UI_TOKENS
        data_type: NUMBER
      - name: ui_requests
        synonyms: [ui requests, snowsight requests]
        description: ACCOUNT-GRAIN request count via UI. Dedupe by account before summing.
        expr: UI_REQUESTS
        data_type: NUMBER
      - name: agent_requests
        synonyms: [coding agent requests, agent requests, agentic requests]
        description: >
          ACCOUNT-GRAIN UI coding-agent request count. Dedupe by account before summing.
        expr: AGENT_REQUESTS
        data_type: NUMBER
      - name: reasoning_agent_requests
        synonyms: [reasoning agent requests, reasoning requests]
        description: >
          ACCOUNT-GRAIN UI reasoning-agent request count. Dedupe by account before summing.
        expr: REASONING_AGENT_REQUESTS
        data_type: NUMBER
    measures:
      - name: total_use_cases
        synonyms: [number of use cases, uc count, total UCs]
        description: Total use cases
        expr: COUNT(USE_CASE_ID)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_use_cases
        synonyms: [coco use cases, coco count, coco UCs, coco qualified]
        description: IS_COCO_FINAL = TRUE count
        expr: COUNT_IF(IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_pct
        synonyms: [coco rate, coco %]
        description: IS_COCO_FINAL % of total
        expr: ROUND(COUNT_IF(IS_COCO_FINAL = TRUE) * 100.0 / NULLIF(COUNT(USE_CASE_ID), 0), 1)
        data_type: NUMBER
        default_aggregation: sum
      - name: deployed_use_cases
        synonyms: [stage 7 count, deployed, go-lives]
        description: Stage 7 Deployed count
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed')
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_deployed
        synonyms: [coco go-lives, coco deployed, deployed with coco]
        description: Deployed IS_COCO_FINAL use cases
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed' AND IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: total_eacv
        synonyms: [total ACV, pipeline value, total revenue]
        description: Total eACV in USD
        expr: SUM(USE_CASE_EACV)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_eacv
        synonyms: [coco ACV, coco revenue, coco pipeline value]
        description: eACV of IS_COCO_FINAL use cases
        expr: SUM(CASE WHEN IS_COCO_FINAL = TRUE THEN USE_CASE_EACV ELSE 0 END)
        data_type: NUMBER
        default_aggregation: sum
      - name: distinct_partners
        synonyms: [partner count, number of partners, unique partners]
        description: Count of distinct partner companies
        expr: COUNT(DISTINCT PARTNER_NAME)
        data_type: NUMBER
        default_aggregation: sum

  - name: use_cases_ytd
