      database: TEMP
      schema: COCO_PARTNER_ADOPTION
      table: V_OKR_USE_CASES_COCO_FINAL
    filters:
      - name: managed_partners
        synonyms: [managed, OKR partners, tracked]
        description: All ~44 managed partners
        expr: >
          PARTNER_NAME IN (
            'Accenture','Capgemini Technologies LLC','Cognizant Technology Solutions US Corp',
            'Deloitte Consulting','EY','Ernst & Young (EY)','IBM','IBM Consulting',
            '7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc','kipi.ai','Kipi.ai',
            'evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
            'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
            'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC',
            'Tiger Analytics Inc.','Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle',
            'Archetype Consulting','Everforth Apex Systems','Tata Consultancy Services',
            'OneSix','Icon Analytics','Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies',
            'NTT DATA Group Corporation','MegazoneCloud Corporation',
            'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
            'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation',
            'INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.',
            'Kubrick Group','KPC (Key Performance Consulting)','KPC'
          )
      - name: is_coco_final
        synonyms: [IS_COCO_FINAL, coco qualified, coco final]
        description: IS_COCO_FINAL = TRUE. Default CoCo filter.
        expr: IS_COCO_FINAL = TRUE
    dimensions:
      - name: partner_name
        synonyms: [partner, SI, company]
        description: Partner name
        expr: PARTNER_NAME
        data_type: TEXT
      - name: use_case_id
        synonyms: [uc id]
        description: Use case identifier
        expr: USE_CASE_ID
        data_type: TEXT
      - name: use_case_stage
        synonyms: [stage, status]
        description: Use case stage
        expr: USE_CASE_STAGE
        data_type: TEXT
      - name: theater
        synonyms: [theater name, geo]
        description: Sales theater
        expr: THEATER_NAME
        data_type: TEXT
      - name: region
        synonyms: [region name, sub-region, country, industry, vertical, sub category, subcategory, additional breakdown, theatre breakdown, theater breakdown, breakdown within theatre, next level breakdown]
        description: "Next level of the sales hierarchy BELOW theater - the theater breakdown / sub-category. Its meaning depends on the theater: USMajors=INDUSTRY (HCLS, FSI, FSIGlobal, TMT, MFG, RCG); USPubSec=government tier (Federal, SLED); APJ=country (ANZ, India, ASEAN, Japan, Korea, China); EMEA=sub-geography (CentralEMEA, SouthEMEA, NorthEMEA, UK, META, EMEACommercial); AMSExpansion=US/Canada geography (CentralExp, NortheastExp, SoutheastExp, SouthwestExp, NorthwestExp, USGrowthExp, CanadaExp, Commercial); AMSAcquisition=segment x geography (EntAcq/CommAcq East|West|Central, MajorsAcq, LATAM). ALWAYS use this to break a single theater down further - e.g. 'US Majors breakdown' means GROUP BY region WHERE theater='USMajors'. Do NOT group by theater to break down one theater."
        expr: REGION_NAME
        data_type: TEXT
      - name: decision_date
        synonyms: [pipeline date, stage 3-4 date]
        description: Date entered stage 3 or 4 — use for Q-specific filtering of stages 3-4
        expr: DECISION_DATE
        data_type: DATE
      - name: go_live_date
        synonyms: [go live, stage 5-7 date]
        description: Date entered stage 5/6/7 — use for Q-specific filtering of stages 5-7
        expr: GO_LIVE_DATE
        data_type: DATE
      - name: is_coco_final
        synonyms: [IS_COCO_FINAL, coco final]
        description: TRUE = CoCo attributed
        expr: IS_COCO_FINAL
        data_type: BOOLEAN
      - name: partner_group
        synonyms: [group, partner type]
        description: GSI | NOAM RSI | APJ RSI | EMEA RSI
        expr: >
          CASE
            WHEN PARTNER_NAME IN ('Accenture','Capgemini Technologies LLC',
              'Cognizant Technology Solutions US Corp','Deloitte Consulting',
              'EY','Ernst & Young (EY)','IBM','IBM Consulting') THEN 'GSI'
            WHEN PARTNER_NAME IN ('7Rivers, Inc','Aimpoint Digital','BlueCloud Services Inc',
              'kipi.ai','Kipi.ai','evolv Consulting','Infostrux Solutions Inc.','Infosys','KPMG LLP',
              'LTM','LTI Mindtree','phData, Inc.','Slalom, LLC.','Squadron Data Inc','Tredence Inc.',
              'Spaulding Ridge','TEKsystems Global Services, LLC.','Blend360, LLC','Tiger Analytics Inc.',
              'Atrium','Perficient Inc.','SDK Tek Services Ltd.','Merkle','Archetype Consulting',
              'Everforth Apex Systems','Tata Consultancy Services','OneSix','Icon Analytics',
              'Sparq Holdings, Inc.','CitiusTech Inc.','Hexaware Technologies') THEN 'NOAM RSI'
            WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation',
              'Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.',
              'Altis Global Limited','Altis Consulting, ANZ','PROLIM Global Corporation') THEN 'APJ RSI'
            WHEN PARTNER_NAME IN ('INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint',
              'CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 'EMEA RSI'
            ELSE 'Other'
          END
        data_type: TEXT

      # ── Backfilled for parity with use_cases_q3 ──────────────────────────
      # ACCOUNT-GRAIN fields (surface, engagement, scores) must be deduplicated
      # by ACCOUNT_NAME_UPPER before aggregating — a plain SUM over use case rows
      # over-counts them. See the grain warning block under use_cases_q3.
      - name: use_case_name
        synonyms: [uc name, use case title, name of the use case]
        description: Name of the use case as it appears in Salesforce.
        expr: USE_CASE_NAME
        data_type: TEXT
      - name: last_active
        synonyms: [last active, last activity, most recent usage, last seen]
        description: >
          ACCOUNT-GRAIN. Most recent date the customer account showed any CoCo
          usage. Repeated on every use case row for that account, so dedupe by
          ACCOUNT_NAME_UPPER before aggregating (use MAX, never SUM).
        expr: LAST_ACTIVE
        data_type: DATE
      - name: distinct_users
        synonyms: [distinct users, number of users, user count, how many users, seats]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of distinct users at the customer account who used CoCo.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: DISTINCT_USERS
        data_type: NUMBER
      - name: active_days
        synonyms: [active days, days active, usage days]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of days the customer account showed CoCo activity.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: ACTIVE_DAYS
        data_type: NUMBER
      - name: total_requests
        synonyms: [total requests, request count, all requests]
        description: >
          ACCOUNT-GRAIN engagement metric. Total CoCo requests from the customer account across all surfaces.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: TOTAL_REQUESTS
        data_type: NUMBER
      - name: tools_invoked
        synonyms: [tools invoked, tool invocations, tool calls, tool usage]
        description: >
          ACCOUNT-GRAIN engagement metric. Total tool invocations by the customer account.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: TOOLS_INVOKED
        data_type: NUMBER
      - name: custom_skills
        synonyms: [custom skills, custom skill count, bespoke skills, skills built]
        description: >
          ACCOUNT-GRAIN engagement metric. Number of custom skills built by the customer account.
          Carried on EVERY use case row for that account, so SUM() over use case
          rows OVER-COUNTS it (~1.9x on Q3 data). ALWAYS collapse to one row per
          ACCOUNT_NAME_UPPER first (MAX per account), then aggregate. See the
          verified queries named *_engagement_* for the correct pattern.
        expr: CUSTOM_SKILLS
        data_type: NUMBER
      - name: relevant_skill_invocations
        synonyms: [relevant skill invocations, bundled skill usage, matching skill usage]
        description: >
          USE-CASE GRAIN. Invocations of bundled skills matching THIS use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (112 of 172 multi-use-case accounts show differing values). Do NOT
          deduplicate by account and do NOT treat it as an account total —
          aggregate it across use case rows normally.
        expr: RELEVANT_SKILL_INVOCATIONS
        data_type: NUMBER
      - name: relevant_custom_skills
        synonyms: [relevant custom skills, matching custom skills]
        description: >
          USE-CASE GRAIN. Custom skills matching THIS use case's WORKLOAD_CATEGORY,
          so it varies between use cases at the same account (81 of 172
          multi-use-case accounts differ). Do NOT deduplicate by account.
        expr: RELEVANT_CUSTOM_SKILLS
        data_type: NUMBER
      - name: total_score
        synonyms: [confidence score, usage score, score, total score, how confident]
        description: >
          USE-CASE GRAIN confidence score 0-100 — the numeric value behind
          CONFIDENCE_BAND (High >= 75, Medium 40-74, Low 1-39, No Signal 0).
          IS_COCO_FINAL is TRUE when IS_COCO is TRUE **or** this score is >= 75.
          Equals S1_SCORE + S2_SCORE + S3_SCORE + S4_SCORE.
          It DEPENDS ON the use case's WORKLOAD_CATEGORY, so two use cases at the
          same account can score differently (104 of 172 multi-use-case accounts
          differ). Do NOT deduplicate by account and never SUM it; report it per
          use case, or use AVG/MAX when rolling up.
        expr: TOTAL_SCORE
        data_type: NUMBER
      - name: s1_score
        synonyms: [s1, s1 score, skill relevance score]
        description: >
          USE-CASE GRAIN skill-relevance component (max 30) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (93 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S1_SCORE
        data_type: NUMBER
      - name: s2_score
        synonyms: [s2, s2 score, custom skill score]
        description: >
          USE-CASE GRAIN custom-skill component (max 35) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (38 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S2_SCORE
        data_type: NUMBER
      - name: s3_score
        synonyms: [s3, s3 score, tool usage score]
        description: >
          ACCOUNT-GRAIN tool-usage component (max 20) of TOTAL_SCORE. Unlike
          S1/S2/S4 this does not depend on WORKLOAD_CATEGORY, so it is identical
          across all use cases at an account — deduplicate by ACCOUNT_NAME_UPPER
          before aggregating. Use it to explain WHY an account scored as it did.
        expr: S3_SCORE
        data_type: NUMBER
      - name: s4_score
        synonyms: [s4, s4 score, intensity score]
        description: >
          USE-CASE GRAIN usage-intensity component (max 15) of TOTAL_SCORE. Derived from the use case's
          WORKLOAD_CATEGORY, so it varies between use cases at the same account
          (96 of 172 multi-use-case accounts differ). Use it to explain WHY a use case scored as it did. Do NOT
          deduplicate by account; never SUM across use cases.
        expr: S4_SCORE
        data_type: NUMBER
      - name: account_name_upper
        synonyms: [account key, uppercased account name, account join key]
        description: >
          Uppercased customer account name. THE DEDUPLICATION KEY for every
          ACCOUNT-GRAIN column (surface credits, engagement metrics, scores).
          GROUP BY this before aggregating any account-grain value.
        expr: ACCOUNT_NAME_UPPER
        data_type: TEXT
      - name: quarter_credits
        synonyms: [credits, token credits, credit spend, quarter credits, spend]
        description: >
          ACCOUNT-GRAIN. Total CoCo token credits for THIS table's quarter. The column is named Q2_CREDITS for historical reasons but holds the quarter of THIS table (Q3 table = Q3 credits). It is NOT specific to Q2.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: Q2_CREDITS
        data_type: NUMBER
      - name: quarter_tokens
        synonyms: [tokens, token usage, token consumption, quarter tokens]
        description: >
          ACCOUNT-GRAIN. Total CoCo tokens for THIS table's quarter. Named Q2_TOKENS for historical reasons but holds the quarter of THIS table. NOT specific to Q2.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: Q2_TOKENS
        data_type: NUMBER
      - name: last7_credits
        synonyms: [last 7 days credits, recent credits, last week credits]
        description: >
          ACCOUNT-GRAIN. Credits in the trailing 7 days. Pair with PRIOR7_CREDITS for week-over-week.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: LAST7_CREDITS
        data_type: NUMBER
      - name: prior7_credits
        synonyms: [prior 7 days credits, previous week credits]
        description: >
          ACCOUNT-GRAIN. Credits in the 7 days before last. WoW% = (LAST7-PRIOR7)/PRIOR7*100.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: PRIOR7_CREDITS
        data_type: NUMBER
      - name: last7_tokens
        synonyms: [last 7 days tokens, recent tokens, last week tokens]
        description: >
          ACCOUNT-GRAIN. Tokens in the trailing 7 days. Pair with PRIOR7_TOKENS for week-over-week.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: LAST7_TOKENS
        data_type: NUMBER
      - name: prior7_tokens
        synonyms: [prior 7 days tokens, previous week tokens]
        description: >
          ACCOUNT-GRAIN. Tokens in the 7 days before last. WoW% = (LAST7-PRIOR7)/PRIOR7*100.
          Carried on EVERY use case row for the account, so SUM() over use case
          rows OVER-COUNTS it. Collapse to one row per ACCOUNT_NAME_UPPER first.
        expr: PRIOR7_TOKENS
        data_type: NUMBER
      - name: account_name
        synonyms: [customer, account]
        description: Customer account name
        expr: ACCOUNT_NAME
        data_type: TEXT
      - name: is_coco_keyword
        synonyms: [IS_COCO, keyword coco, se tagged]
        description: Keyword/flag only — SE comments, partner #coco, feature flag
        expr: IS_COCO
        data_type: BOOLEAN
      - name: confidence_band
        synonyms: [confidence, score band]
        description: "High(>=75)=IS_COCO_FINAL. Medium(40-74). Low(1-39). No Signal(0)."
        expr: CONFIDENCE_BAND
        data_type: TEXT
      - name: coco_source
        synonyms: [attribution source, detection method]
        description: SE_COMMENTS | PARTNER_COMMENTS | FEATURE_FLAG | MULTIPLE
        expr: COCO_SOURCE
        data_type: TEXT
      - name: workload_category
        synonyms: [workload, domain, category]
        description: "AI | Analytics | Data Engineering | Platform | Apps & Collab | Migration"
        expr: WORKLOAD_CATEGORY
        data_type: TEXT
      - name: technical_use_case
        synonyms: [tech uc, use case type]
        description: "Prefixed category: AI:, Analytics:, DE:, Platform:, Apps & Collab:"
        expr: TECHNICAL_USE_CASE
        data_type: TEXT
      - name: eacv
        synonyms: [acv, opportunity value, deal value]
        description: Estimated Annual Contract Value in USD
        expr: USE_CASE_EACV
        data_type: NUMBER
      - name: cli_credits
        synonyms: [cli, coco cli, command line, terminal, cli credits, cli spend]
        description: >
          ACCOUNT-GRAIN token credits used via the CoCo CLI. Repeated on every use
          case row for the account — dedupe by ACCOUNT_NAME_UPPER before summing.
        expr: CLI_CREDITS
        data_type: NUMBER
      - name: cli_tokens
        synonyms: [cli tokens, command line tokens]
        description: ACCOUNT-GRAIN tokens via CLI. Dedupe by account before summing.
        expr: CLI_TOKENS
        data_type: NUMBER
      - name: cli_requests
        synonyms: [cli requests, command line requests]
        description: ACCOUNT-GRAIN request count via CLI. Dedupe by account before summing.
        expr: CLI_REQUESTS
        data_type: NUMBER
      - name: desktop_credits
        synonyms: [desktop, coco desktop, desktop app, desktop credits, desktop spend]
        description: >
          ACCOUNT-GRAIN token credits used via CoCo Desktop. Repeated on every use
          case row for the account — dedupe by ACCOUNT_NAME_UPPER before summing.
        expr: DESKTOP_CREDITS
        data_type: NUMBER
      - name: desktop_tokens
        synonyms: [desktop tokens]
        description: ACCOUNT-GRAIN tokens via Desktop. Dedupe by account before summing.
        expr: DESKTOP_TOKENS
        data_type: NUMBER
      - name: desktop_requests
        synonyms: [desktop requests]
        description: ACCOUNT-GRAIN request count via Desktop. Dedupe by account before summing.
        expr: DESKTOP_REQUESTS
        data_type: NUMBER
      - name: ui_credits
        synonyms: [ui, web ui, snowsight, snowsight ui, ui credits, ui spend]
        description: >
          ACCOUNT-GRAIN token credits used via the CoCo UI (Snowsight). Repeated on
          every use case row for the account — dedupe by ACCOUNT_NAME_UPPER first.
        expr: UI_CREDITS
        data_type: NUMBER
      - name: ui_tokens
        synonyms: [ui tokens, snowsight tokens]
        description: ACCOUNT-GRAIN tokens via UI. Dedupe by account before summing.
        expr: UI_TOKENS
        data_type: NUMBER
      - name: ui_requests
        synonyms: [ui requests, snowsight requests]
        description: ACCOUNT-GRAIN request count via UI. Dedupe by account before summing.
        expr: UI_REQUESTS
        data_type: NUMBER
      - name: agent_requests
        synonyms: [coding agent requests, agent requests, agentic requests]
        description: >
          ACCOUNT-GRAIN UI coding-agent request count. Dedupe by account before summing.
        expr: AGENT_REQUESTS
        data_type: NUMBER
      - name: reasoning_agent_requests
        synonyms: [reasoning agent requests, reasoning requests]
        description: >
          ACCOUNT-GRAIN UI reasoning-agent request count. Dedupe by account before summing.
        expr: REASONING_AGENT_REQUESTS
        data_type: NUMBER
    measures:
      - name: total_use_cases
        synonyms: [number of use cases, uc count, total UCs, all use cases, ytd total]
        description: Total use cases across all of FY27
        expr: COUNT(USE_CASE_ID)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_use_cases
        synonyms: [coco use cases, coco count, ytd coco, full year coco, IS_COCO_FINAL count]
        description: IS_COCO_FINAL = TRUE count for YTD
        expr: COUNT_IF(IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_pct
        synonyms: [coco rate, coco %, ytd coco rate, full year adoption rate]
        description: IS_COCO_FINAL % of total for FY27 YTD
        expr: ROUND(COUNT_IF(IS_COCO_FINAL = TRUE) * 100.0 / NULLIF(COUNT(USE_CASE_ID), 0), 1)
        data_type: NUMBER
        default_aggregation: sum
      - name: deployed_use_cases
        synonyms: [stage 7 count, deployed, go-lives, ytd go-lives]
        description: Stage 7 Deployed count for FY27 YTD
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed')
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_deployed
        synonyms: [coco go-lives, coco deployed, ytd coco go-lives]
        description: Deployed IS_COCO_FINAL use cases for FY27 YTD
        expr: COUNT_IF(USE_CASE_STAGE = '7 - Deployed' AND IS_COCO_FINAL = TRUE)
        data_type: NUMBER
        default_aggregation: sum
      - name: total_eacv
        synonyms: [total ACV, pipeline value, total revenue]
        description: Total eACV in USD
        expr: SUM(USE_CASE_EACV)
        data_type: NUMBER
        default_aggregation: sum
      - name: coco_final_eacv
        synonyms: [coco ACV, coco revenue, coco pipeline value]
        description: eACV of IS_COCO_FINAL use cases
        expr: SUM(CASE WHEN IS_COCO_FINAL = TRUE THEN USE_CASE_EACV ELSE 0 END)
        data_type: NUMBER
        default_aggregation: sum
      - name: distinct_partners
        synonyms: [partner count, number of partners, unique partners]
        description: Count of distinct partner companies
        expr: COUNT(DISTINCT PARTNER_NAME)
        data_type: NUMBER
        default_aggregation: sum

  - name: token_usage
    description: >
      Daily CoCo credit/token consumption (CORTEX_CODE_USER_DAY_FACT).
      Always filter SNOWFLAKE_ACCOUNT_TYPE='Customer' AND TOTAL_DAILY_REQUESTS>0.
      WoW: Last7d=DS>=DATEADD(day,-7,TODAY()). Prior7d between -14d and -7d.
      Quarter windows: Q1=Feb-Apr, Q2=May-Jul, Q3=Aug-Oct. YTD=DS>='2026-02-01'.
    base_table:
      database: SNOWSCIENCE
      schema: LLM
      table: CORTEX_CODE_USER_DAY_FACT
    filters:
      - name: customer_accounts_only
        synonyms: [customers, real accounts]
        description: Real customer accounts only
        expr: SNOWFLAKE_ACCOUNT_TYPE = 'Customer'
      - name: active_users_only
        synonyms: [active, has usage]
        description: At least one CoCo request
        expr: TOTAL_DAILY_REQUESTS > 0
      - name: q3_usage
        synonyms: [q3 tokens, q3 credits, current quarter usage]
        description: Q3 FY27 consumption
        expr: DS BETWEEN '2026-08-01' AND '2026-10-31'
      - name: q2_usage
        synonyms: [q2 tokens, q2 credits, last quarter usage]
        description: Q2 FY27 consumption
        expr: DS BETWEEN '2026-05-01' AND '2026-07-31'
      - name: ytd_usage
        synonyms: [ytd tokens, ytd credits, full year usage]
        description: FY27 YTD consumption
        expr: DS >= '2026-02-01'
    dimensions:
      - name: usage_date
        synonyms: [date, day, ds]
        description: Daily usage date
        expr: DS
        data_type: DATE
      - name: sf_account_name
        synonyms: [account name, customer name]
        description: Salesforce account name
        expr: SALESFORCE_ACCOUNT_NAME
        data_type: TEXT
      - name: account_type
        synonyms: [customer or partner]
        description: Always filter to Customer
        expr: SNOWFLAKE_ACCOUNT_TYPE
        data_type: TEXT
    measures:
      - name: total_credits
        synonyms: [credits, credit spend, cost, spend]
        description: Total CoCo credit spend
        expr: SUM(TOTAL_TOKEN_CREDITS)
        data_type: NUMBER
        default_aggregation: sum
      - name: total_tokens
        synonyms: [tokens, token volume]
        description: Total input + output tokens
        expr: SUM(TOTAL_TOKENS)
        data_type: NUMBER
        default_aggregation: sum
      - name: last_7d_tokens
        synonyms: [last week tokens, last 7d tokens]
        description: Tokens in rolling last 7 days
        expr: SUM(CASE WHEN DS >= DATEADD('day',-7,CURRENT_DATE()) THEN TOTAL_TOKENS ELSE 0 END)
        data_type: NUMBER
        default_aggregation: sum
      - name: prior_7d_tokens
        synonyms: [prior week tokens, wow baseline]
        description: Tokens 7-14 days ago
        expr: SUM(CASE WHEN DS >= DATEADD('day',-14,CURRENT_DATE()) AND DS < DATEADD('day',-7,CURRENT_DATE()) THEN TOTAL_TOKENS ELSE 0 END)
        data_type: NUMBER
        default_aggregation: sum
      - name: token_wow_pct
        synonyms: [token wow, token week over week, weekly token change]
        description: WoW% change in tokens
        expr: >
          ROUND((SUM(CASE WHEN DS >= DATEADD('day',-7,CURRENT_DATE()) THEN TOTAL_TOKENS ELSE 0 END)
            - SUM(CASE WHEN DS >= DATEADD('day',-14,CURRENT_DATE()) AND DS < DATEADD('day',-7,CURRENT_DATE()) THEN TOTAL_TOKENS ELSE 0 END))
            * 100.0 / NULLIF(SUM(CASE WHEN DS >= DATEADD('day',-14,CURRENT_DATE()) AND DS < DATEADD('day',-7,CURRENT_DATE()) THEN TOTAL_TOKENS ELSE 0 END), 0), 1)
        data_type: NUMBER
        default_aggregation: sum
      - name: active_accounts
        synonyms: [accounts with usage, unique accounts]
        description: Distinct accounts with CoCo usage
        expr: COUNT(DISTINCT SALESFORCE_ACCOUNT_NAME)
        data_type: NUMBER
        default_aggregation: sum

verified_queries:

  # ── OVERALL ADOPTION ────────────────────────────────────────────────────────

  - name: overall_q3_adoption
    question: What is the overall CoCo adoption rate for all managed partners in Q3?
    sql: |
      SELECT
        COUNT(USE_CASE_ID)                                                          AS total_uc,
        COUNT_IF(IS_COCO_FINAL = TRUE)                                              AS coco_uc,
        ROUND(COUNT_IF(IS_COCO_FINAL=TRUE)*100.0/NULLIF(COUNT(USE_CASE_ID),0),1)   AS coco_pct,
        ROUND(SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN USE_CASE_EACV ELSE 0 END)/1e6,1) AS coco_eacv_m,
        COUNT_IF(IS_COCO_FINAL=TRUE AND USE_CASE_STAGE='7 - Deployed')              AS coco_deployed
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q3

  - name: overall_q2_adoption
    question: What is the overall CoCo adoption rate for all managed partners in Q2?
    sql: |
      SELECT
        COUNT(USE_CASE_ID)                                                          AS total_uc,
        COUNT_IF(IS_COCO_FINAL = TRUE)                                              AS coco_uc,
        ROUND(COUNT_IF(IS_COCO_FINAL=TRUE)*100.0/NULLIF(COUNT(USE_CASE_ID),0),1)   AS coco_pct,
        ROUND(SUM(CASE WHEN IS_COCO_FINAL=TRUE THEN USE_CASE_EACV ELSE 0 END)/1e6,1) AS coco_eacv_m
      FROM TEMP.COCO_PARTNER_ADOPTION.V_OKR_USE_CASES_COCO_FINAL_Q2

  - name: q3_adoption_by_group
