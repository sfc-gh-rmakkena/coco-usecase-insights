  - name: usmajors_q3_summary
    question: Total and CoCo-qualified use cases for USMajors in Q3
    sql: |
      SELECT
        COUNT(USE_CASE_ID)               AS total_use_cases,
        COUNT_IF(IS_COCO_FINAL = TRUE)   AS coco_final_use_cases,
