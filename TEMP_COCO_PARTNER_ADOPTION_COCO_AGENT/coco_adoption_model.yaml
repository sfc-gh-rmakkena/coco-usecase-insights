               WHEN PARTNER_NAME IN ('NTT DATA Group Corporation','MegazoneCloud Corporation','Infinite Lambda Limited','Infinite Lambda Inc','INFINITE LAMBDA (SINGAPORE) PTE. LTD.','Altis Consulting, ANZ','PROLIM Global Corporation','INFOMOTION GMBH','INFOMOTION GMBH, BearingPoint','CIVICA SOFTWARE, S.L.','Kubrick Group','KPC (Key Performance Consulting)','KPC') THEN 50
